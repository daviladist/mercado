<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A66B2"><link rel="manifest" href="/equipe.webmanifest"><link rel="apple-touch-icon" href="/icons/equipe-apple-180.png"><link rel="icon" type="image/png" sizes="192x192" href="/icons/equipe-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="D'Ávila Equipe"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>D'Ávila Equipe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna para celular; etiqueta de preço amarela como no gôndola do supermercado */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#E9EFF7; --fg:#0F1B2D; --muted:#5A6779; --line:#D5DEEA;
  --accent:#0A66B2; --accent-fg:#FFFFFF; --accent-soft:#E1EDF9;
  --brand:#E11F2C; --brand-dark:#B3121D; --brand-fg:#FFFFFF; --stripe:#0A66B2;
  --tag:#FFD43B; --tag-fg:#1B1A10; --danger:#C4161F; --ok:#1E7B4C; --warn:#9A6400;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B121D; --surface:#142030; --surface-2:#1C2B3F; --fg:#E8EEF6; --muted:#9AA8BA; --line:#283A52;
  --accent:#5AAEF0; --accent-fg:#06213A; --accent-soft:#16304C; --brand:#C81B27; --brand-dark:#99121B; --brand-fg:#FFFFFF; --stripe:#0A66B2;
  --tag:#F5CB2E; --tag-fg:#1B1A10; --danger:#FF8A80; --ok:#6FD6A0; --warn:#F0B95A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B121D; --surface:#142030; --surface-2:#1C2B3F; --fg:#E8EEF6; --muted:#9AA8BA; --line:#283A52;
  --accent:#5AAEF0; --accent-fg:#06213A; --accent-soft:#16304C; --brand:#C81B27; --brand-dark:#99121B; --brand-fg:#FFFFFF; --stripe:#0A66B2;
  --tag:#F5CB2E; --tag-fg:#1B1A10; --danger:#FF8A80; --ok:#6FD6A0; --warn:#F0B95A; color-scheme:dark}
*{box-sizing:border-box}
/* --sat = altura da barra de status do celular (iPhone com o app instalado). O corpo da página começa abaixo dela;
   sem isso, o cabeçalho fixo "descia" por cima do conteúdo e cobria textos e botões. */
:root{--sat:env(safe-area-inset-top,0px)}
html{scroll-padding-top:calc(var(--sat) + var(--toph,66px) + var(--tabsh,0px) + 12px)}
body{margin:0;padding-top:var(--sat);background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* barra de demonstração */
.demo{display:none!important}.teamlinks{margin-top:12px;color:var(--muted);line-height:1.8}.teamlinks a{color:var(--accent);font-weight:600}.srvbadge{position:fixed;right:12px;bottom:12px;background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;z-index:99;opacity:.85}.srvbadge[hidden]{display:none}.instbox{margin:12px auto 0;max-width:420px;padding:0 4px;text-align:center}.pwbox{display:grid;gap:8px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;margin:2px 0 10px;background:var(--surface)}.srvnet{position:fixed;left:0;right:0;top:var(--sat,0px);z-index:120;background:#B3261E;color:#fff;font-weight:700;font-size:14px;padding:10px 14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}.srvnet[hidden],.srvalert[hidden]{display:none}.srvalert{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:121;background:#fff4f2;color:#7a1610;border:2px solid #B3261E;border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 18px rgba(0,0,0,.2)}.srvalert .btn{margin-left:auto}
.demo .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:8px}
.demo b{font-weight:600}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* topo */
header.top{position:sticky;top:var(--sat);z-index:20;background:var(--brand);background-image:linear-gradient(180deg,var(--brand),var(--brand-dark));color:var(--brand-fg);border-bottom:4px solid var(--stripe)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;line-height:1}
.brand .logo{height:44px;width:auto;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.brand .bt{display:grid;min-width:0;gap:2px}
.brand .bn{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand .bn{display:none}.brand .logo{height:40px}}
.iconbtn{border:0;background:transparent;color:inherit;padding:8px;border-radius:10px;font-weight:600;font-size:13px}
.cartbtn{position:relative;display:flex;align-items:center;gap:8px;background:var(--tag);color:var(--tag-fg);border:0;border-radius:12px;padding:8px 12px;font-weight:700}
.cartbtn svg{width:22px;height:22px}
.cartbtn .badge{position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:12px;display:grid;place-items:center;padding:0 6px;border:2px solid var(--brand)}
.cartbtn .tot{font-family:var(--display);font-size:18px;line-height:1}
.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.12)}}

main{padding-block:16px 40px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.3px}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}

/* formulários */
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-fg);min-height:48px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:18px}

/* login */
.login{max-width:400px;margin:24px auto;display:grid;gap:14px}
.login .hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}

/* catálogo */
.validity{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
@media (max-width:480px){.products{grid-template-columns:1fr 1fr;gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .ph{aspect-ratio:1/1;max-width:100%;background:var(--surface-2);position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .name{font-weight:600;font-size:14px;line-height:1.25;min-height:2.5em}
.card .unit{font-size:12px;color:var(--muted)}
.ptag{align-self:flex-start;background:var(--tag);color:var(--tag-fg);border-radius:6px;padding:3px 8px 2px;font-family:var(--display);font-weight:800;line-height:1;display:flex;align-items:baseline;gap:3px}
.ptag .cur{font-size:13px}
.ptag .val{font-size:26px}
.ptag .per{font-family:var(--body);font-size:11px;font-weight:600;margin-left:3px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:auto}
.stepper button{border:0;background:var(--surface-2);width:44px;height:42px;font-size:20px;font-weight:700;flex:none}
.stepper input{border:0;text-align:center;min-width:0;width:100%;height:42px;background:transparent;font-weight:700;font-size:16px;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{appearance:none}
.addbtn{margin-top:auto;border:0;background:var(--accent);color:var(--accent-fg);border-radius:10px;height:44px;font-weight:700}
.card.incart{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* carrinho (gaveta) */
.scrim{position:fixed;inset:0;background:rgba(5,15,10,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding-top:var(--sat);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .db{flex:1;overflow-y:auto;padding:14px 16px;display:grid;gap:14px;align-content:start}
.drawer .df{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px 14px;display:grid;gap:8px}
.ci{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.ci img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface-2)}
.ci .t{min-width:0}
.ci .t b{display:block;font-size:14px;line-height:1.25}
.ci .stepper{width:128px;margin-top:6px}
.ci .stepper button{width:36px;height:34px;font-size:17px}
.ci .stepper input{height:34px;font-size:15px}
.ci .sub{text-align:right;font-weight:700;display:grid;gap:4px;justify-items:end}
.link{border:0;background:none;color:var(--danger);font-size:12px;font-weight:600;padding:4px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;font-weight:700;display:grid;gap:2px}
.opt span{font-weight:500;font-size:12px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sum{display:flex;justify-content:space-between;font-size:14px}
.sum.total{font-size:15px;font-weight:700;align-items:baseline}
.sum.total .v{font-family:var(--display);font-size:32px;line-height:1}
.notice{font-size:13px;color:var(--warn);font-weight:600}

/* pedidos */
.orders{display:grid;gap:10px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.order .oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.order .no{font-family:var(--display);font-weight:800;font-size:22px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-novo{color:var(--warn)} .s-separando{color:var(--accent)} .s-separado{color:#B7791F} .s-pronto{color:var(--ok)} .s-saiu{color:#7A4FD0}
.stbar{display:flex;gap:6px;flex-wrap:wrap}
.sbcond{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.sbcgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:820px){.sbcgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.sbcgrid{grid-template-columns:1fr}}
.sbc{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.sbc.on{border-color:var(--accent);background:var(--accent-soft)}
.sbct{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.sbct input{width:76px;min-height:38px;padding:6px 8px}
.sbct input[type=number]{width:60px}
.sbct2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sbct2 label{display:grid;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600}
.sbct2 input{width:100%;min-height:38px;padding:6px 8px}
.addrbox{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.addrgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.addrgrid .a-wide,.addrgrid .a-3{grid-column:span 3}
.addrgrid .a-2{grid-column:span 2}
@media (max-width:620px){.addrgrid{grid-template-columns:1fr 1fr}.addrgrid .a-wide,.addrgrid .a-2,.addrgrid .a-3{grid-column:1/-1}}
.olist{display:grid;gap:6px}
.svmode .lnmg,.svmode [data-lmg]{display:none!important}
.svmode .lnpair label:has(input[data-lpk]),.svmode .lnpair label:has(input[data-lqu]){display:none!important}
.svonly{display:none}.svmode .svonly{display:block;margin-top:2px;text-align:left}
.rvbox{display:grid;gap:12px}
.catpol{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:4px 0}
.catpol label{display:inline-flex;align-items:center;gap:4px;font-weight:600;margin-right:6px}
.catpol input::placeholder{color:#A0AEC0;font-weight:400;font-style:italic}
.catpol input{width:58px;min-height:30px;padding:3px 6px;text-align:right;font-weight:700}
.catpol.sub input{width:52px}
.rvlist{display:grid;gap:0}
.rvrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 2px}
.rvrow .rvn{min-width:0}
.rvp{display:grid;gap:2px;font-size:11px}
.rvp input{width:84px;min-height:36px;padding:4px 8px;text-align:right;font-weight:700}
.rvp input.ovr{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.rvt{min-width:82px;text-align:right}
.rvsum{display:grid;gap:4px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.rvsum>div{display:flex;justify-content:space-between;gap:10px}
.rvtot{font-size:18px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.rvbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
@media (max-width:420px){.rvrow{grid-template-columns:minmax(0,1fr) auto;}.rvrow .rvn{grid-column:1/-1}.rvt{min-width:0}}
.commsim{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr);gap:12px;align-items:center;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.commsimout{font-size:13.5px;line-height:1.5}
@media (max-width:520px){.commsim{grid-template-columns:1fr}}
.commnote{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:13.5px;line-height:1.4}
.commchip{display:inline-block;font-size:11px;font-weight:700;background:#E6F4EA;color:#1B6E35;border-radius:999px;padding:1px 8px;vertical-align:middle}
.lockbox{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;border:2px solid}
.lockbox .lki{font-size:20px;line-height:1}
.lockbox.ok{border-color:#1B7F3B;background:#E6F4EA;color:#14532D}
.lockbox.no{border-color:var(--danger,#C62828);background:#FDECEA;color:#7F1D1D}
.vcper{flex-wrap:wrap;border-radius:14px}
.vctiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media (max-width:640px){.vctiles{grid-template-columns:repeat(2,minmax(0,1fr))!important}.vctiles .tile{min-width:0}.vctiles .tile b{font-size:clamp(16px,5.4vw,24px)}}
.anbox{display:grid;gap:10px;margin-bottom:12px;border-left:5px solid #F2B705}
.anhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.anrej{display:grid;gap:8px;background:#FDECEA;border-radius:10px;padding:10px 12px}
.anrej textarea{min-height:70px}
.vord{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.vord.vadj{border:2px solid #D32F2F}
.vord .vrowb{border:0;background:none;width:100%;text-align:left;color:var(--fg);font:inherit;cursor:pointer}
.vord .vrowb .r{display:flex;align-items:center;gap:6px}
.vord .vrowb[aria-expanded=true] .orchev{transform:rotate(180deg)}
.vdet{display:grid;gap:8px;padding:0 12px 12px}
.vnote{background:#FDECEA;color:#7F1D1D;border-radius:8px;padding:8px 10px;font-size:14px}
.vitems{min-width:0!important;font-size:13px}
.anbox.anmin{padding:6px 10px;margin-bottom:8px}
.anrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto 20px;gap:14px;align-items:center;width:100%;background:none;border:0;padding:6px 2px;text-align:left;color:var(--fg);font:inherit;cursor:pointer}
.anrow .ancli{display:grid;gap:2px;min-width:0}
.anfig{display:grid;justify-items:end;gap:1px}
.anfig .lbl{font-size:10.5px}
.anrow[aria-expanded=true] .orchev{transform:rotate(180deg)}
@media (max-width:640px){.anrow{grid-template-columns:repeat(3,minmax(0,1fr)) 18px;gap:6px 10px}.anrow .ancli{grid-column:1/-1}.anfig{justify-items:start}}
.antable{min-width:0!important}
.anits{display:grid;gap:8px;margin:4px 0}
.anit{display:grid;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.anit.chg{border-color:#D32F2F;background:#FFF7F6}
.anit .anf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.anit .anf label{display:grid;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
.anit .anf input{width:100%;min-height:36px;padding:4px 6px;text-align:right;font-weight:700;font-size:15px}
.anit .anf .ro{text-align:right;font-weight:700;font-size:15px;padding:6px 0}
@media (max-width:520px){.anit .anf{grid-template-columns:repeat(2,minmax(0,1fr))}}
