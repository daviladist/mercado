<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script src="/tema.js"></script>
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<title>Tino — Central do sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Central do Tino: visual neutro (preto, branco e cinzas), letra pequena, blocos que abrem e fecham */
:root{--bg:#FAFAFA;--surface:#FFFFFF;--ink:#111111;--ink-2:#404040;--muted:#737373;--line:#E5E5E5;--line-2:#F0F0F0;--input:#D4D4D4;--hover:#F5F5F5;--danger:#B91C1C;--ok:#15803D;--warn:#A16207;--off:#D4D4D4}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit}
.errbtn{display:inline-flex;align-items:center;gap:6px}
.errn{background:var(--danger);color:#fff;border-radius:999px;min-width:18px;height:18px;padding:0 5px;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.errl{display:grid;gap:8px;margin-top:10px}
.erri{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.erri.novo{border-left:3px solid var(--danger)}
.erri code{font-size:11px;word-break:break-all}
.erri .m{font-weight:500;word-break:break-word}
.spark{display:block}
header{background:var(--surface);border-bottom:1px solid var(--line)}
header .in{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;min-height:48px}
.brand{display:flex;align-items:center;gap:10px}
.ico{width:26px;height:26px;border-radius:6px;background:var(--ink);display:grid;place-items:center;flex:none}
.wm{display:flex;align-items:baseline;gap:8px}
.wm b{font-size:15px;font-weight:600;letter-spacing:-.2px;line-height:1}
.wm span{font-size:12px;color:var(--muted)}
.slogan{display:none}
.who{display:flex;gap:6px;align-items:center}
.chip{color:var(--muted);padding:0 6px;font-size:12px}
.btn{min-height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--input);background:var(--surface);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary,.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled),.btn.dark:hover:not(:disabled){background:#262626}
.btn.ghost-light{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em;font-family:"Geist","Inter",system-ui,sans-serif}
h1,h2,.wm b,.num,td,.spark{font-variant-numeric:tabular-nums}
.wm b{font-family:"Geist","Inter",system-ui,sans-serif}
h2{margin:0;font-size:13px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}
/* login */
.login{max-width:360px;margin:64px auto;padding:0 16px}
.login .card{display:grid;gap:12px;padding:20px}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=password],select{min-height:32px;padding:0 10px;border:1px solid var(--input);border-radius:6px;background:var(--surface);width:100%;font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--ink)}
.err{color:var(--danger);font-weight:500;font-size:12px;min-height:18px}
/* lista de empresas */
nav{flex:1 1 240px;max-width:280px;display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
nav .head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px}
nav .head h2{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
nav .head .btn{min-height:26px;padding:0 8px;font-size:12px}
#tlist{gap:2px!important}
.tn{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;border:0;background:transparent}
.tn:hover{background:var(--hover)}
.tn b{display:block;font-size:13px;font-weight:500}.tn span{font-size:12px;color:var(--muted)}
.tn[aria-current=true]{background:var(--line-2)}
.tn[aria-current=true] b{font-weight:600}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;margin-left:6px;vertical-align:middle;color:var(--muted)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.st.ativa::before{background:var(--ok)}.st.em_preparo::before{background:var(--warn)}.st.suspensa{color:var(--danger)}.st.suspensa::before{background:var(--danger)}
main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:8px;max-width:880px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
main>.card.top{background:transparent;border:0;padding:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;align-items:start}
.logo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo-box{width:40px;height:40px;border-radius:6px;border:1px dashed var(--input);display:grid;place-items:center;font-size:10px;color:var(--muted);overflow:hidden;background:var(--surface)}
.logo-box img{width:100%;height:100%;object-fit:contain}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line)}
.sw button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.sw input[type=color]{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;padding:1px;background:var(--surface)}
.preview{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line-2)}
.pv-btn{display:inline-block;padding:6px 12px;border-radius:6px;color:#fff;font-weight:500;font-size:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{min-height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--input);background:var(--surface);font-weight:500;font-size:12px}
.presets button:hover:not(:disabled){background:var(--hover)}
.presets button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.grp h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.grp h2 small{font-size:12px;font-weight:400;color:var(--muted)}
.mod{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line-2)}
.mod:first-of-type{border-top:0}
.mod .t{min-width:0}.mod .n{font-weight:500}.mod .d{font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:400;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.lock{flex:none;font-size:11px;color:var(--muted)}
.sw-t{flex:none;position:relative;width:32px;height:18px;border-radius:999px;border:0;padding:0;background:var(--off)}
.sw-t span{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw-t[aria-checked=true]{background:var(--ink)}.sw-t[aria-checked=true] span{left:16px}
.bar{position:static;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.bar.dirty{position:sticky;bottom:12px;color:var(--ink);border-color:var(--ink);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:9}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
code.link{display:block;overflow-wrap:anywhere;padding:4px 8px;color:var(--ink-2)}
.links{display:grid}.lk{display:grid;grid-template-columns:minmax(140px,180px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2)}.lk:first-child{border-top:0}.lk-t{display:grid;gap:0}.lk-t b{font-weight:500}.lk-b{display:flex;gap:4px}.lk-b .btn{min-height:28px;padding:0 10px;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;color:inherit}
@media (max-width:720px){.lk{grid-template-columns:1fr}}
.rtabs{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.rtabs button{display:flex;justify-content:space-between;align-items:center;min-height:30px;border:0;border-radius:6px;background:transparent;font-weight:500;font-size:13px;color:var(--ink-2);padding:0 10px;text-align:left}
.rtabs button:hover{background:var(--hover)}
.rtabs button[aria-selected=true]{background:var(--line-2);color:var(--ink);font-weight:600}
.rtabs small{font-weight:400;color:var(--muted);font-size:12px}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--ink-2)}
@media (max-width:640px){nav{max-width:none;position:static}}
.subopt{display:flex;gap:10px;align-items:flex-start;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.subopt input{width:16px;height:16px;flex:none;margin:2px 0 0;accent-color:var(--ink)}
.subopt span{display:grid;gap:0}
/* blocos que abrem e fecham */
details.fold{padding:0}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;user-select:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";margin-left:auto;flex:none;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(45deg)}
details.fold>summary:hover{background:var(--hover);border-radius:8px}
details.fold[open]>summary:hover{border-radius:8px 8px 0 0}
details.fold>summary h2{margin:0;display:block}
details.fold>summary .sum{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
details.fold>.fb{display:grid;gap:10px;padding:2px 16px 14px}
details.fold.grp>.fb{gap:0}
/* modo escuro */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0A0A0A;--surface:#141414;--ink:#EDEDED;--ink-2:#C4C4C4;--muted:#8F8F8F;--line:#262626;--line-2:#1F1F1F;--input:#3A3A3A;--hover:#1C1C1C;--danger:#F87171;--ok:#4ADE80;--warn:#FACC15;--off:#3A3A3A}
  :root:not([data-theme="light"]) body{color-scheme:dark}
  :root:not([data-theme="light"]) .btn.primary,:root:not([data-theme="light"]) .btn.dark,:root:not([data-theme="light"]) .presets button[aria-pressed=true],:root:not([data-theme="light"]) .toast{color:#0A0A0A}
  :root:not([data-theme="light"]) .btn.primary:hover:not(:disabled),:root:not([data-theme="light"]) .btn.dark:hover:not(:disabled){background:#D4D4D4}
  :root:not([data-theme="light"]) .sw-t span{background:#EDEDED}:root:not([data-theme="light"]) .sw-t[aria-checked=true] span{background:#0A0A0A}
  :root:not([data-theme="light"]) .ico svg path{fill:#0A0A0A}
  :root:not([data-theme="light"]) .errn{color:#2A0606}
}
/* escolha manual: escuro */
  :root[data-theme="dark"]{--bg:#0A0A0A;--surface:#141414;--ink:#EDEDED;--ink-2:#C4C4C4;--muted:#8F8F8F;--line:#262626;--line-2:#1F1F1F;--input:#3A3A3A;--hover:#1C1C1C;--danger:#F87171;--ok:#4ADE80;--warn:#FACC15;--off:#3A3A3A}
  :root[data-theme="dark"] body{color-scheme:dark}
  :root[data-theme="dark"] .btn.primary,:root[data-theme="dark"] .btn.dark,:root[data-theme="dark"] .presets button[aria-pressed=true],:root[data-theme="dark"] .toast{color:#0A0A0A}
  :root[data-theme="dark"] .btn.primary:hover:not(:disabled),:root[data-theme="dark"] .btn.dark:hover:not(:disabled){background:#D4D4D4}
  :root[data-theme="dark"] .sw-t span{background:#EDEDED}:root[data-theme="dark"] .sw-t[aria-checked=true] span{background:#0A0A0A}
  :root[data-theme="dark"] .ico svg path{fill:#0A0A0A}
  :root[data-theme="dark"] .errn{color:#2A0606}
</style>
</head>
<body>
<header><div class="in">
  <div class="brand">
    <div class="ico"><svg class="spark" role="img" aria-label="Ícone do Tino" viewBox="0 0 40 40" width="14" height="14"><path d="M20 0 C22 13 27 18 40 20 C27 22 22 27 20 40 C18 27 13 22 0 20 C13 18 18 13 20 0 Z" fill="#FFFFFF"/></svg></div>
    <div><div class="wm"><b>tino</b><span>Central</span></div><div class="slogan">Quem tem Tino, <em>vende melhor.</em></div></div>
  </div>
  <div class="who" id="who" hidden><button class="btn ghost-light errbtn" id="errBtn" type="button" aria-label="Erros do servidor">Erros do servidor <span class="errn" id="errN" hidden>0</span></button><span class="chip" id="whoName">super_admin</span><button class="btn ghost-light" id="logout" type="button">Sair</button></div>
</div></header>

<section class="login" id="loginView" hidden>
  <form class="card" id="loginForm" autocomplete="on">
    <h1 style="font-size:16px">Entrar na Central</h1>
    <p class="muted small" style="margin:-6px 0 0">Acesso exclusivo do dono do sistema.</p>
    <div class="field"><label for="lu">Usuário</label><input type="text" id="lu" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
    <div class="field"><label for="lp">Senha</label><input type="password" id="lp" autocomplete="current-password" required></div>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</section>

<div class="wrap" id="appView" hidden>
  <nav aria-label="Empresas">
    <div class="rtabs" id="rtabs" role="tablist" aria-label="Tipo de empresa"></div>
    <div class="head"><h2>Empresas</h2><button class="btn" id="newT" type="button">+ Nova</button></div>
    <div id="tlist" style="display:flex;flex-direction:column;gap:8px"></div>
  </nav>
  <main id="editor"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/central.js"></script>
</body>
</html>
