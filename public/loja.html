<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3D2B">
<link rel="manifest" href="/cliente.webmanifest">
<link rel="apple-touch-icon" href="/icons/tino-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/tino-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loja">
<meta name="referrer" content="no-referrer">
<title>Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/tino-app.css">
<style>
main{padding-bottom:110px}
.hero{background:var(--brand);color:#fff;border-radius:16px;padding:16px;display:grid;gap:6px}
.hero h1{color:#fff;font-size:22px}.hero p{color:#EDE6D6;font-size:14px}
.search{position:relative}.search input{padding-left:42px}.search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px}
.cats-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats-row .chip{flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.pc .im{aspect-ratio:1/1;background:var(--cream);display:grid;place-items:center;font-size:40px;position:relative;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:10px 12px 12px;display:grid;gap:3px}
.pc .nm{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .pr{font-size:17px;font-weight:800;color:var(--brand)}
.pc .de{font-size:12px;color:var(--muted);text-decoration:line-through}
.pc .fx{font-size:11.5px;font-weight:700;color:var(--green)}
.tag{position:absolute;left:8px;top:8px;background:var(--gold);color:#2A1E05;font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px}
.tag.off{background:#555;color:#fff}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;border-radius:14px;scrollbar-width:none}
.gal img{flex:none;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center;border-radius:14px;background:var(--cream)}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--input);border-radius:12px;overflow:hidden;background:#fff;width:max-content}
.qty button{width:48px;height:48px;border:0;background:#fff;font-size:22px;font-weight:700}
.qty input{width:58px;height:48px;border:0;text-align:center;font-weight:800;font-size:18px;padding:0;min-height:0}
.qty.sm button{width:38px;height:38px;font-size:18px}.qty.sm input{width:42px;height:38px;font-size:15px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(246,241,231,.95) 30%)}
.cartbar button{max-width:640px;margin:0 auto;width:100%;min-height:56px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.ci{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.ci:first-child{border-top:0}
.ci .th{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--cream);display:grid;place-items:center}
.ci .th img{width:100%;height:100%;object-fit:cover}
.passo{display:flex;gap:8px;align-items:center}.passo i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:800;font-size:13px}
.passo.on i{background:var(--green);color:#fff}.passo.agora i{background:var(--gold)}
.cartbtn{position:relative;background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;min-height:40px;padding:0 12px;font-weight:700}
.cartbtn b{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#2A1E05;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
</style>
</head><body>
<header class="hd"><div class="in">
  <div class="co"><div class="lg" id="lg"><svg viewBox="0 0 40 40" width="20" height="20" aria-hidden="true"><path d="M20 0 C22 13 27 18 40 20 C27 22 22 27 20 40 C18 27 13 22 0 20 C13 18 18 13 20 0 Z" fill="#E8A33D"/></svg></div>
  <div style="min-width:0"><b id="coName">Loja</b><small id="coSub">Compre pelo celular</small></div></div>
  <button class="cartbtn" id="cartTop" type="button" aria-label="Carrinho">🛒 <b id="cartN" hidden>0</b></button>
</div></header>
<main id="main" aria-live="polite"><p class="muted">Carregando a loja…</p></main>
<div class="cartbar" id="cartbar" hidden><button type="button" id="cartBtn"><span id="cartTxt">Ver carrinho</span><span id="cartTot"></span></button></div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/loja.js"></script>
</body></html>
