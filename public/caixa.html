<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3D2B">
<link rel="manifest" href="/equipe.webmanifest">
<link rel="apple-touch-icon" href="/icons/tino-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/tino-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tino">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Tino · Controle de caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<style>
:root{--brand:#1F3D2B;--gold:#E8A33D;--gold-soft:#FBEFD9;--cream:#F6F1E7;--surface:#fff;--line:#E6DCC8;--line-2:#EFE7D6;--input:#CFC3AA;--muted:#5E6A5F;--ink:#1F2A22;--green:#1E7A3C;--green-bg:#E3F1E6;--red:#B3261E;--red-bg:#F9E3E1;--blue:#0A5A9C;--blue-bg:#E2EEF8}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:16px/1.45 "Sora",system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.hd{background:var(--brand);color:#fff;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:5}
.hd .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.hd .co{display:flex;align-items:center;gap:10px;min-width:0}
.hd .lg{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.hd .lg img{width:100%;height:100%;object-fit:contain}
.hd b{font-size:19px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd small{display:block;font-size:11px;color:#F2E6CF;letter-spacing:.06em;text-transform:uppercase}
.hd .out{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;min-height:38px;padding:0 12px;font-size:13px}
main{max-width:720px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.4px}
h2{font-size:17px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--input);background:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1E05}
.btn.dan{color:var(--red);border-color:#E7B8B3}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:700;color:#3B4A3F}
input[type=text],input[type=date],input[type=password],input[inputmode],select,textarea{min-height:50px;padding:0 14px;border:1px solid var(--input);border-radius:10px;background:#fff;width:100%}
textarea{padding:10px 14px;min-height:70px}
.money{font-size:24px;font-weight:700}
.saldo{border-radius:14px;padding:18px;display:grid;gap:4px;text-align:center}
.saldo b{font-size:32px;font-weight:800}
.saldo.p{background:var(--green-bg);color:var(--green)}.saldo.n{background:var(--red-bg);color:var(--red)}.saldo.z{background:var(--line-2)}
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.it{display:flex;min-width:0;gap:12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line-2)}
.it:first-child{border-top:0}
.it .ic{width:42px;height:42px;border-radius:12px;background:var(--cream);display:grid;place-items:center;font-size:20px;flex:none}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px;font-weight:600}.it .tx span{font-size:13px;color:var(--muted);display:block}
.it .vl{font-weight:700;white-space:nowrap;text-align:right}
.pos{color:var(--green)}.neg{color:var(--red)}.inf{color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.pill.ok{background:var(--green-bg);color:var(--green)}.pill.wa{background:var(--gold-soft);color:#5C3D00}
nav.bn{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.bn .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);align-items:end}
nav.bn button{background:none;border:0;min-height:62px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.bn button i{font-style:normal;font-size:21px;line-height:1}
nav.bn button[aria-current=true]{color:var(--brand)}
.sheet{position:fixed;inset:0;background:rgba(20,28,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .pn{background:var(--cream);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:14px}
@media (min-width:700px){.sheet{align-items:center}.sheet .pn{border-radius:18px}}
.sheet .tt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .x{width:42px;height:42px;border-radius:50%;border:1px solid var(--input);background:#fff;font-size:20px;line-height:1}
.note{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:14px;color:#5C3D00}
.warn{background:var(--red-bg);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--red);font-weight:600}
.empty{text-align:center;padding:28px 12px;display:grid;gap:12px;justify-items:center}
.empty .big{font-size:44px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;white-space:nowrap}
.login{max-width:420px;margin:40px auto;padding:0 16px}
.tino{text-align:center;font-size:12px;color:var(--muted)}.tino b{color:var(--brand)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}
</style>
</head><body>
<header class="hd"><div class="in">
  <div class="co"><div class="lg" id="lg"><svg viewBox="0 0 40 40" width="20" height="20" aria-hidden="true"><path d="M20 0 C22 13 27 18 40 20 C27 22 22 27 20 40 C18 27 13 22 0 20 C13 18 18 13 20 0 Z" fill="#E8A33D"/></svg></div>
  <div style="min-width:0"><b id="coName">Tino</b><small>Controle de caixa</small></div></div>
  <button class="out" id="sair" type="button" hidden>Sair</button>
</div></header>
<main id="main" aria-live="polite"><p class="muted">Carregando…</p></main>
<nav class="bn" id="bn" hidden aria-label="Menu"><div class="in">
  <button type="button" data-go="inicio"><i>🏠</i>Início</button>
  <button type="button" data-go="sangria" id="navSangria"><i>💵</i>Sangria</button>
  <button type="button" data-go="sacolas" id="navSacolas"><i>📦</i>Sacolas</button>
  <button type="button" data-go="staria" id="navStaria"><i>🔄</i>StarIA</button>
  <button type="button" data-go="acessos" id="navAcessos"><i>👥</i>Acessos</button>
  <button type="button" data-go="gaveta" id="navGaveta"><i>🧾</i>Impostos</button>
  <button type="button" data-go="ocorrencias" id="navOcorrencias"><i>🛡️</i>Ocorrências</button>
</div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/caixa.js"></script>
<script src="/suporte.js"></script>
</body></html>
