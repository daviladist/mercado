<!doctype html><meta charset="utf-8"><title>Prova da arte</title>
<link rel="stylesheet" href="/public/encartes-v2/fontes/fontes.css">
<body style="margin:0;background:#333"><canvas id="cv" style="width:540px"></canvas>
<script type="module">
import { desenharPagina } from '/public/encartes-v2/arte/encarte.js';
import { paginar } from '/public/encartes-v2/arte/diagrama.js';
const FX = '/tests/fixtures/encartes-v2/';
const carregar = src => new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => erro(new Error('não abriu ' + src)); i.src = src; });
const q = new URLSearchParams(location.search);
const caso = await (await fetch(FX + (q.get('caso') || 'esquenta') + '.json')).json();
for (const f of ['400 40px Anton', '700 40px Oswald', '600 40px Oswald', '400 40px "Archivo Black"', '700 40px Archivo']) await document.fonts.load(f);
const logos = await Promise.all(['/public/encartes-v2/logos/davila.png', '/public/encartes-v2/logos/redeshow.png'].map(carregar));
for (const p of caso.produtos) if (p.foto) p.foto = await carregar(FX + p.foto);
if (caso.tema.cabecalho) caso.tema.cabecalho = await carregar(FX + caso.tema.cabecalho);
const paginas = paginar(caso.produtos, caso.capa || caso.porPagina || caso.produtos.length, caso.verso);
desenharPagina(document.getElementById('cv').getContext('2d'), { formato: q.get('formato') || caso.formato, tema: caso.tema, logos, produtos: paginas[+(q.get('pagina') || 0)], verso: +(q.get('pagina') || 0) > 0, rodape: caso.rodape });
window.PRONTO = true;
</script>
