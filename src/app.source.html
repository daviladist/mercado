<title>Pedidos Atacado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna para celular; etiqueta de preço amarela como no gôndola do supermercado */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#E9EFF7; --fg:#0F1B2D; --muted:#5A6779; --line:#D5DEEA;
  --accent:#0A66B2; --accent-fg:#FFFFFF; --accent-soft:#E1EDF9;
  --brand:#E11F2C; --brand-dark:#B3121D; --brand-fg:#FFFFFF; --stripe:#0A66B2;
  --tag:#FFD43B; --tag-fg:#1B1A10; --danger:#C4161F; --ok:#1E7B4C; --warn:#9A6400;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B121D; --surface:#142030; --surface-2:#1C2B3F; --fg:#E8EEF6; --muted:#9AA8BA; --line:#283A52;
  --accent:#5AAEF0; --accent-fg:#06213A; --accent-soft:#16304C; --brand:#C81B27; --brand-dark:#99121B; --brand-fg:#FFFFFF; --stripe:#0A66B2;
  --tag:#F5CB2E; --tag-fg:#1B1A10; --danger:#FF8A80; --ok:#6FD6A0; --warn:#F0B95A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B121D; --surface:#142030; --surface-2:#1C2B3F; --fg:#E8EEF6; --muted:#9AA8BA; --line:#283A52;
  --accent:#5AAEF0; --accent-fg:#06213A; --accent-soft:#16304C; --brand:#C81B27; --brand-dark:#99121B; --brand-fg:#FFFFFF; --stripe:#0A66B2;
  --tag:#F5CB2E; --tag-fg:#1B1A10; --danger:#FF8A80; --ok:#6FD6A0; --warn:#F0B95A; color-scheme:dark}
*{box-sizing:border-box}
/* --sat = altura da barra de status do celular (iPhone com o app instalado). O corpo da página começa abaixo dela;
   sem isso, o cabeçalho fixo "descia" por cima do conteúdo e cobria textos e botões. */
:root{--sat:env(safe-area-inset-top,0px)}
html{scroll-padding-top:calc(var(--sat) + var(--toph,66px) + var(--tabsh,0px) + 12px)}
body{margin:0;padding-top:var(--sat);background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* barra de demonstração */
.demo{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.demo .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:8px}
.demo b{font-weight:600}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* topo */
header.top{position:sticky;top:var(--sat);z-index:20;background:var(--brand);background-image:linear-gradient(180deg,var(--brand),var(--brand-dark));color:var(--brand-fg);border-bottom:4px solid var(--stripe)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;line-height:1}
.brand .logo{height:44px;width:auto;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.brand .bt{display:grid;min-width:0;gap:2px}
.brand .bn{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand .bn{display:none}.brand .logo{height:40px}}
.iconbtn{border:0;background:transparent;color:inherit;padding:8px;border-radius:10px;font-weight:600;font-size:13px}
.cartbtn{position:relative;display:flex;align-items:center;gap:8px;background:var(--tag);color:var(--tag-fg);border:0;border-radius:12px;padding:8px 12px;font-weight:700}
.cartbtn svg{width:22px;height:22px}
.cartbtn .badge{position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:12px;display:grid;place-items:center;padding:0 6px;border:2px solid var(--brand)}
.cartbtn .tot{font-family:var(--display);font-size:18px;line-height:1}
.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.12)}}

main{padding-block:16px 40px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.3px}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}

/* formulários */
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-fg);min-height:48px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:18px}

/* login */
.login{max-width:400px;margin:24px auto;display:grid;gap:14px}
.login .hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}

/* catálogo */
.validity{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
@media (max-width:480px){.products{grid-template-columns:1fr 1fr;gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .ph{aspect-ratio:1/1;max-width:100%;background:var(--surface-2);position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .name{font-weight:600;font-size:14px;line-height:1.25;min-height:2.5em}
.card .unit{font-size:12px;color:var(--muted)}
.ptag{align-self:flex-start;background:var(--tag);color:var(--tag-fg);border-radius:6px;padding:3px 8px 2px;font-family:var(--display);font-weight:800;line-height:1;display:flex;align-items:baseline;gap:3px}
.ptag .cur{font-size:13px}
.ptag .val{font-size:26px}
.ptag .per{font-family:var(--body);font-size:11px;font-weight:600;margin-left:3px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:auto}
.stepper button{border:0;background:var(--surface-2);width:44px;height:42px;font-size:20px;font-weight:700;flex:none}
.stepper input{border:0;text-align:center;min-width:0;width:100%;height:42px;background:transparent;font-weight:700;font-size:16px;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{appearance:none}
.addbtn{margin-top:auto;border:0;background:var(--accent);color:var(--accent-fg);border-radius:10px;height:44px;font-weight:700}
.card.incart{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* carrinho (gaveta) */
.scrim{position:fixed;inset:0;background:rgba(5,15,10,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding-top:var(--sat);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .db{flex:1;overflow-y:auto;padding:14px 16px;display:grid;gap:14px;align-content:start}
.drawer .df{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px 14px;display:grid;gap:8px}
.ci{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.ci img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface-2)}
.ci .t{min-width:0}
.ci .t b{display:block;font-size:14px;line-height:1.25}
.ci .stepper{width:128px;margin-top:6px}
.ci .stepper button{width:36px;height:34px;font-size:17px}
.ci .stepper input{height:34px;font-size:15px}
.ci .sub{text-align:right;font-weight:700;display:grid;gap:4px;justify-items:end}
.link{border:0;background:none;color:var(--danger);font-size:12px;font-weight:600;padding:4px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;font-weight:700;display:grid;gap:2px}
.opt span{font-weight:500;font-size:12px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sum{display:flex;justify-content:space-between;font-size:14px}
.sum.total{font-size:15px;font-weight:700;align-items:baseline}
.sum.total .v{font-family:var(--display);font-size:32px;line-height:1}
.notice{font-size:13px;color:var(--warn);font-weight:600}

/* pedidos */
.orders{display:grid;gap:10px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.order .oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.order .no{font-family:var(--display);font-weight:800;font-size:22px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-novo{color:var(--warn)} .s-separando{color:var(--accent)} .s-separado{color:#B7791F} .s-pronto{color:var(--ok)} .s-saiu{color:#7A4FD0}
.stbar{display:flex;gap:6px;flex-wrap:wrap}
.sbcond{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.sbcgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:820px){.sbcgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.sbcgrid{grid-template-columns:1fr}}
.sbc{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.sbc.on{border-color:var(--accent);background:var(--accent-soft)}
.sbct{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.sbct input{width:76px;min-height:38px;padding:6px 8px}
.sbct input[type=number]{width:60px}
.sbct2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sbct2 label{display:grid;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600}
.sbct2 input{width:100%;min-height:38px;padding:6px 8px}
.addrbox{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.addrgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.addrgrid .a-wide,.addrgrid .a-3{grid-column:span 3}
.addrgrid .a-2{grid-column:span 2}
@media (max-width:620px){.addrgrid{grid-template-columns:1fr 1fr}.addrgrid .a-wide,.addrgrid .a-2,.addrgrid .a-3{grid-column:1/-1}}
.olist{display:grid;gap:6px}
.svmode .lnmg,.svmode [data-lmg]{display:none!important}
.svmode .lnpair label:has(input[data-lpk]),.svmode .lnpair label:has(input[data-lqu]){display:none!important}
.svonly{display:none}.svmode .svonly{display:block;margin-top:2px;text-align:left}
.rvbox{display:grid;gap:12px}
.catpol{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:4px 0}
.catpol label{display:inline-flex;align-items:center;gap:4px;font-weight:600;margin-right:6px}
.catpol input::placeholder{color:#A0AEC0;font-weight:400;font-style:italic}
.catpol input{width:58px;min-height:30px;padding:3px 6px;text-align:right;font-weight:700}
.catpol.sub input{width:52px}
.rvlist{display:grid;gap:0}
.rvrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 2px}
.rvrow .rvn{min-width:0}
.rvp{display:grid;gap:2px;font-size:11px}
.rvp input{width:84px;min-height:36px;padding:4px 8px;text-align:right;font-weight:700}
.rvp input.ovr{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.rvt{min-width:82px;text-align:right}
.rvsum{display:grid;gap:4px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.rvsum>div{display:flex;justify-content:space-between;gap:10px}
.rvtot{font-size:18px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.rvbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
@media (max-width:420px){.rvrow{grid-template-columns:minmax(0,1fr) auto;}.rvrow .rvn{grid-column:1/-1}.rvt{min-width:0}}
.commsim{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr);gap:12px;align-items:center;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.commsimout{font-size:13.5px;line-height:1.5}
@media (max-width:520px){.commsim{grid-template-columns:1fr}}
.commnote{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:13.5px;line-height:1.4}
.commchip{display:inline-block;font-size:11px;font-weight:700;background:#E6F4EA;color:#1B6E35;border-radius:999px;padding:1px 8px;vertical-align:middle}
.lockbox{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;border:2px solid}
.lockbox .lki{font-size:20px;line-height:1}
.lockbox.ok{border-color:#1B7F3B;background:#E6F4EA;color:#14532D}
.lockbox.no{border-color:var(--danger,#C62828);background:#FDECEA;color:#7F1D1D}
.vcper{flex-wrap:wrap;border-radius:14px}
.vctiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media (max-width:640px){.vctiles{grid-template-columns:repeat(2,minmax(0,1fr))!important}.vctiles .tile{min-width:0}.vctiles .tile b{font-size:clamp(16px,5.4vw,24px)}}
.anbox{display:grid;gap:10px;margin-bottom:12px;border-left:5px solid #F2B705}
.anhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.anrej{display:grid;gap:8px;background:#FDECEA;border-radius:10px;padding:10px 12px}
.anrej textarea{min-height:70px}
.vord{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.vord.vadj{border:2px solid #D32F2F}
.vord .vrowb{border:0;background:none;width:100%;text-align:left;color:var(--fg);font:inherit;cursor:pointer}
.vord .vrowb .r{display:flex;align-items:center;gap:6px}
.vord .vrowb[aria-expanded=true] .orchev{transform:rotate(180deg)}
.vdet{display:grid;gap:8px;padding:0 12px 12px}
.vnote{background:#FDECEA;color:#7F1D1D;border-radius:8px;padding:8px 10px;font-size:14px}
.vitems{min-width:0!important;font-size:13px}
.anbox.anmin{padding:6px 10px;margin-bottom:8px}
.anrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto 20px;gap:14px;align-items:center;width:100%;background:none;border:0;padding:6px 2px;text-align:left;color:var(--fg);font:inherit;cursor:pointer}
.anrow .ancli{display:grid;gap:2px;min-width:0}
.anfig{display:grid;justify-items:end;gap:1px}
.anfig .lbl{font-size:10.5px}
.anrow[aria-expanded=true] .orchev{transform:rotate(180deg)}
@media (max-width:640px){.anrow{grid-template-columns:repeat(3,minmax(0,1fr)) 18px;gap:6px 10px}.anrow .ancli{grid-column:1/-1}.anfig{justify-items:start}}
.antable{min-width:0!important}
.anits{display:grid;gap:8px;margin:4px 0}
.anit{display:grid;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.anit.chg{border-color:#D32F2F;background:#FFF7F6}
.anit .anf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.anit .anf label{display:grid;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
.anit .anf input{width:100%;min-height:36px;padding:4px 6px;text-align:right;font-weight:700;font-size:15px}
.anit .anf .ro{text-align:right;font-weight:700;font-size:15px;padding:6px 0}
@media (max-width:520px){.anit .anf{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chg{color:#C62828!important}
.chgtxt{color:#C62828!important;font-weight:700}
.it.chgit{background:#FDECEA;border-radius:8px;padding:4px 6px}
.negbox{display:grid;gap:2px;background:#E8F5EC;border:1px solid #9FD3B0;color:#14532D;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:8px}
.negbox.off{background:var(--surface-2);border-color:var(--line);color:var(--fg)}
.neglink{color:var(--accent);font-weight:700;margin-top:6px;display:inline-block}
.negform{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end;margin-top:6px}.negform label{display:grid;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}.negform input{min-height:36px;font-size:16px;font-weight:700}.negform .link{grid-column:1/-1;justify-self:start}
.negst{font-size:13px;margin-top:6px;border-radius:8px;padding:4px 8px}.negst.ok{background:#E6F4EA;color:#1B6E35}.negst.an{background:#FFF4D6;color:#8A5A00}
.negnote{background:#FFF4D6;color:#5C3D00;border-radius:8px;padding:6px 10px}
.negcfg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}.negcfg legend{font-weight:700;padding:0 6px}
.anit.negask{border:2px solid #F2B705;background:#FFFBEA}.anit.negask.negok{border-color:#22A04B;background:#F1FAF3}
.anit.negask.chg{border-color:#D32F2F}
.negtag{justify-self:start;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;background:#F2B705;color:#3D2A00;border-radius:6px;padding:2px 8px}

/* menor preço entre as condições que valem para esta quantidade, pagamento e forma de receber */
function priceFor(p,q,mode,pay){
  const r=p.rules||emptyRules();
  let best={price:baseOf(p),label:''};
  const tryp=(v,label)=>{v=Number(v);if(v>0&&v<best.price)best={price:v,label}};
  if(promoOk(r))tryp(ieAdj(p,r.promo.price),'Promoção');
  if(r.qty.on&&condOn('qty'))r.qty.tiers.forEach(t=>{if(t.min>0&&q>=t.min)tryp(ieAdj(p,t.price),'A partir de '+t.min)});
  if(r.vista.on&&condOn('vista')&&(S.cashPays||[]).includes(pay))tryp(ieAdj(p,r.vista.price),'À vista');
  if(r.retira.on&&condOn('retira')&&mode==='retirada')tryp(ieAdj(p,r.retira.price),'Retirada no depósito');
  best.ie=ieOn()&&ieF(p)<1;
  best.rp=!!(r.retira&&r.retira.on&&Number(r.retira.price)>0);
  return best;
}

  const k=ui.mode==='retirada'&&!onerOn()?1-(Number(S.store.pickupDisc)||0)/100:1,net=asked*k,ie=!!(ui.client&&ieClient(ui.client)&&ui.nf);
  const cost=effCost(p,lockCost(p),net,ie),rate=sl?lnCommRate(p,sl.id):0,mg=(net-cost-net*rate/100)/net*100;return mg>=min-1e-9?'ok':'an'}

    if(pack<it.price*0.5){toast('Proposta muito abaixo do preço. Tente um valor mais próximo.');return}
    ui.neg=ui.neg||{};ui.neg[id]=pack;ui.negEdit=null;rer();
    const r=cartItems().find(x=>x.p.id===id);toast(r&&r.neg&&r.neg.st==='ok'?'Proposta aceita! O preço já está no seu pedido.':'Proposta enviada: a loja analisa quando você finalizar o pedido.')};
  L.querySelectorAll('[data-negok]').forEach(b=>b.onclick=()=>go(b.dataset.negok));
  {const i=$('#negv');if(i)i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go(ui.negEdit)}}}
}
/* resumo do que os clientes propõem: mostra onde a tabela parece cara */
function negReport(){const since=addDays(today(),-60),L=(S.negLog||[]).filter(x=>String(x.at).slice(0,10)>=since);if(!L.length)return '';
  const m=new Map();L.forEach(x=>{const r=m.get(x.pid)||{name:x.name,n:0,auto:0,off:0,cli:new Set()};r.n++;if(x.st==='ok')r.auto++;r.off+=x.from>0?(x.from-x.asked)/x.from*100:0;r.cli.add(x.cid);m.set(x.pid,r)});
  const rows=[...m.values()].sort((a,b)=>b.n-a.n).slice(0,15);
  return `<section class="panel" style="margin-top:14px;display:grid;gap:6px"><span class="lbl">Propostas dos clientes (últimos 60 dias)</span><div class="small muted">Os produtos que mais pedem para negociar, e quanto abaixo da tabela pedem em média. Um bom sinal de onde o preço pode estar alto.</div>

function cartItems(){return negApply(withOner(ONER_M!=null?ONER_M:ui.mode,()=>Object.entries(ui.cart).map(([id,q])=>({p:resolveCart(id),q})).filter(i=>i.p&&i.p.active&&i.q>0).map(i=>Object.assign(i,priceFor(i.p,i.q,ui.mode,ui.pay)))))}
function cartSub(){return cartItems().reduce((s,i)=>s+i.price*i.q,0)}
/* desconto da retirada: vale para os itens que não usaram o preço especial de retirada do produto */
function pickupDisc(){if(ui.mode!=='retirada'||onerOn())return 0;const pc=Number(S.store.pickupDisc)||0;return pc?pickAmt(cartItems().filter(i=>!noDisc(i)),pc):0}
function cartTotal(){return cartSub()-pickupDisc()}
/* formas de pagamento liberadas para o cliente (sem lista = todas) */
/* CNPJ / CPF: máscara e dígitos verificadores */
function fmtDoc(v){v=String(v).replace(/\D/g,'');if(v.length<=11)return v.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/,'.$1-$2');return v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/,(m,a,b,c,d,e)=>a+'.'+b+'.'+c+'/'+d+(e?'-'+e:''))}
function validDoc(d){
  if(/^(\d)\1+$/.test(d))return false;
  if(d.length===11){const dv=n=>{let s=0;for(let i=0;i<n;i++)s+=+d[i]*(n+1-i);const r=s*10%11;return r===10?0:r};return dv(9)===+d[9]&&dv(10)===+d[10]}
  if(d.length===14){const dv=n=>{const w=n===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];let s=0;for(let i=0;i<n;i++)s+=+d[i]*w[i];const r=s%11;return r<2?0:11-r};return dv(12)===+d[12]&&dv(13)===+d[13]}
  return false;
}
function docHint(v){v=String(v).replace(/\D/g,'');if(!v)return 'Opcional. O cliente também pode entrar no app com o CNPJ/CPF no lugar do usuário.';if(v.length===11)return validDoc(v)?'CPF válido':'CPF inválido';if(v.length===14)return validDoc(v)?'CNPJ válido':'CNPJ inválido';return v.length<11?'Digite os 11 números do CPF ou os 14 do CNPJ.':'Faltam números para o CNPJ.'}
function allowedPays(c){const all=S.payments;return c&&Array.isArray(c.pays)?all.filter(p=>c.pays.includes(p)):all}
function cartSavings(){return withOner(ui.mode,()=>cartItems().reduce((s,i)=>s+((i.p.isCombo?i.p.listPrice:baseOf(i.p))-i.price)*i.q,0))}
function matches(p,q){if(!q)return true;const d=q.replace(/\s/g,'');return p.name.toLowerCase().includes(q)||String(p.code||'').toLowerCase().includes(d)||String(p.ean||'').includes(d)||String(p.ean2||'').includes(d)||(p.eans||[]).some(c=>String(c).includes(d))||String(p.sub||'').toLowerCase().includes(q)}
function codesLine(code,ean){const a=[];if(code)a.push('Cód. '+esc(code));if(ean)a.push('EAN '+esc(ean));return a.join(' · ')}
function cartCount(){return cartItems().reduce((s,i)=>s+i.q,0)}
function fmtDate(d){if(!d)return'';const[y,m,dd]=d.split('-');return dd+'/'+m}

function packWord(p,plural){const w=(String(p.unit||'').trim().split(/\s+/)[0]||'embalagem').toLowerCase().replace(/[^a-zà-ú]/g,'')||'embalagem';return plural?(/m$/.test(w)?w.slice(0,-1)+'ns':/s$/.test(w)?w:w+'s'):w}
function uP(v,p){const n=dispPack(p);return n?brl(Math.round(v/n*100)/100)+'/'+uw(p):brl(v)}

function scanCode(o,raw,mult){
  const code=normCode(raw);if(!code){scanFlash(false,'Código vazio');beep(false);return}
  const now=Date.now();if(scanCam&&code===scanLast.code&&now-scanLast.at<1500)return;scanLast={code,at:now};
  const its=o.items.filter(i=>i.q>0),hit=its.find(i=>itemCodes(i).has(code));
  if(!hit){const p=S.products.find(x=>[x.ean,x.ean2,x.code,...(x.eans||[])].some(c=>normCode(c)===code));beep(false);scanFlash(false,'Não está no pedido'+(p?': '+p.name:'')+' ('+code+')');
    (o.scanLog=o.scanLog||[]).push({at:new Date().toISOString(),code,ok:false,by:ui.checker});save();return}
  const k=ikey(hit),n=Math.max(1,parseInt(mult)||1);o.scan=o.scan||{};o.chk=o.chk||{};
  const cur=o.scan[k]||0;if(cur>=hit.q){beep(false);scanFlash(false,hit.name+': já completou '+hit.q+' de '+hit.q);return}
  const nv=Math.min(hit.q,cur+n);o.scan[k]=nv;if(nv>=hit.q)o.chk[k]=true;
  if(o.status==='novo'){o.checker=ui.checker;o.checkStartAt=o.checkStartAt||new Date().toISOString();setOrderStatus(o,'separando')}
  (o.scanLog=o.scanLog||[]).push({at:new Date().toISOString(),code,ok:true,k,n:nv-cur,by:ui.checker});
  save();beep(true);scanFlash(true,(nv>=hit.q?'✓ ':'')+hit.name+' · '+nv+' de '+hit.q);
}

}

const locDay=iso=>{if(!iso)return '';const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hm=iso=>iso?new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
function fmtDur(min){if(min==null||!isFinite(min))return '—';min=Math.round(min);return min<60?min+' min':Math.floor(min/60)+'h'+String(min%60).padStart(2,'0')}
function confStats(o){
  const its=o.items.filter(i=>i.q>0),sc=o.scan||{},sg=o.sugs||[],log=o.scanLog||[];
  const start=o.checkStartAt||'',end=o.checkedAt||'';
  return {start,end,dur:start&&end?(new Date(end)-new Date(start))/60000:null,items:its.length,
    packs:its.reduce((s,i)=>s+i.q,0),scanned:its.filter(i=>(sc[ikey(i)]||0)>=i.q).length,
    faltas:sg.filter(s=>s.type==='qtd').length,trocas:sg.filter(s=>s.type==='troca').length,incl:sg.filter(s=>s.type==='inclusao').length,
    bipErr:log.filter(l=>!l.ok).length,bipOk:log.filter(l=>l.ok).length,volumes:Number(o.volumes)||0}
}
function periodRange(P){const t=today();
  if(P.per==='hoje')return [t,t];if(P.per==='ontem'){const y=addDays(t,-1);return [y,y]}
  if(P.per==='7')return [addDays(t,-6),t];if(P.per==='30')return [addDays(t,-29),t];
  return [P.from||t,P.to||t]}
function confDone(from,to,who){return S.orders.filter(o=>o.checkedAt&&locDay(o.checkedAt)>=from&&locDay(o.checkedAt)<=to&&(!who||o.checker===who)).sort((a,b)=>String(b.checkedAt).localeCompare(String(a.checkedAt)))}
function confTiles(list){const st=list.map(confStats),n=list.length,durs=st.map(s=>s.dur).filter(d=>d!=null),avg=durs.length?durs.reduce((a,b)=>a+b,0)/durs.length:null;

    <div class="tile"><span class="lbl">Tempo médio</span><b class="num">${fmtDur(avg)}</b><span class="small muted">por pedido</span></div>
    <div class="tile ${st.reduce((a,s)=>a+s.faltas,0)?'t-warn':''}"><span class="lbl">Faltas e trocas</span><b class="num">${st.reduce((a,s)=>a+s.faltas,0)} · ${st.reduce((a,s)=>a+s.trocas+s.incl,0)}</b><span class="small muted">faltas · trocas/inclusões</span></div>

function confRowHtml(o,attr){const s=confStats(o);

function sugStdPrice(o,p,q){const cli=S.customers.find(x=>x.id===o.customerId)||null;return withIe(!!(o.nf&&ieClient(cli)),()=>withClient(cli,()=>priceFor(p,q,o.mode,o.pay)))}
function dropRec(o){const mine=r=>r.orderId===o.id||(!r.orderId&&String(r.orderNo||'')===String(o.no)&&r.customerId===o.customerId);
  const paid=S.receivables.filter(r=>mine(r)&&r.paidAt);S.receivables=S.receivables.filter(r=>!(mine(r)&&!r.paidAt));o.recLaunched=paid.length>0;o.recAuto=false;
  return paid.length?' · tinha parcela paga: confira o contas a receber':' · removido do contas a receber, lance de novo'}
function sugBox(o){const pend=sugPending(o);if(!pend.length)return '';
  return `<div class="sugbox"><b>Sugestões do conferente (${pend.length})</b>${pend.map(s=>{const p=S.products.find(x=>x.id===s.pid);const old=s.type==='troca'?o.items.find(i=>ikey(i)===s.fromKey):null;
    const std=p?sugStdPrice(o,p,s.q):null,pk=std?std.price:0,diff=old?pk*s.q-old.price*old.q:pk*s.q;
    if(s.type==='qtd'){const it=o.items.find(i=>ikey(i)===s.fromKey),dif=it?it.price*(s.q-it.q):0;
      return `<div class="sugrow"><div class="sugt"><span class="rulechip" style="color:var(--warn)">Falta</span> <b>${esc(s.fromName)}</b>: pedido ${esc(qtyTxt(s.qFrom,s.unit,0))} → separado <b>${esc(qtyTxt(s.q,s.unit,0))}</b>
        <div class="small muted">${esc(s.by||'Conferente')}${s.note?' · "'+esc(s.note)+'"':''}${it?' · '+(dif<0?'−':'+')+' '+brl(Math.abs(dif))+' no pedido (mantém o preço combinado)':' · item não está mais no pedido'}</div></div>
        <div class="row" style="gap:6px">${it?`<button class="btn dlb" data-sgok="${o.id}|${s.id}">Aprovar falta</button>`:''}<button class="btn ghost dlb" data-sgno="${o.id}|${s.id}">Recusar</button></div></div>`}
    return `<div class="sugrow"><div class="sugt">${s.type==='troca'?`<span class="rulechip">Troca</span> ${old?esc(qtyTxt(old.q,old.unit,packOfItem(old)))+' · <s>'+esc(old.name)+'</s> ('+brl(old.price)+')':esc(s.fromName)} → <b>${esc(qtyTxt(s.q,s.unit,s.pk))} · ${esc(s.name)}</b>`:`<span class="rulechip">Incluir</span> <b>${esc(qtyTxt(s.q,s.unit,s.pk))} · ${esc(s.name)}</b>`}
      <div class="small muted">${esc(s.by||'Conferente')}${s.note?' · "'+esc(s.note)+'"':''}${p?'':' · produto não existe mais'}${s.toSeller?' · <b class="sepwait">perguntado ao vendedor '+esc((ordSeller(o)||{}).name||'')+' '+ageTxt(s.at)+'</b>'+(hoursSince(s.at)>=pendH().warn?' <span class="apchip no">sem resposta</span>':''):''}${s.expired?' · <b class="neg">o vendedor não respondeu a tempo: decida você</b>':''}</div></div>
      ${p?`<div class="sugact"><label class="small">Preço da embalagem R$ <input type="text" inputmode="decimal" class="lnpr" data-sgp="${s.id}" value="${money(pk)}"></label><span class="small muted">padrão ${brl(pk)}${std&&std.label?' · '+esc(std.label):''} · ${diff>=0?'+':'−'} ${brl(Math.abs(diff))} no pedido</span>
        <div class="row" style="gap:6px"><button class="btn dlb" data-sgok="${o.id}|${s.id}">Aprovar</button><button class="btn ghost dlb" data-sgno="${o.id}|${s.id}">Recusar</button>${!s.toSeller&&ordSeller(o)?`<button class="btn ghost dlb" data-sgsend="${o.id}|${s.id}">Enviar para o vendedor</button>`:''}</div></div>`:`<div class="row"><button class="btn ghost dlb" data-sgno="${o.id}|${s.id}">Recusar</button></div>`}</div>`}).join('')}</div>`}
function approveSug(o,s,packPrice){
  if(s.type==='qtd'){const it=o.items.find(i=>ikey(i)===s.fromKey);if(!it)return 'O item não está mais no pedido.';const before=o.total;
    if(o.totalOrig==null)o.totalOrig=o.total;if(it.qOrig==null)it.qOrig=it.q;it.q=s.q;Object.assign(o,orderTotals(o));o.adjAt=new Date().toISOString();s.status='aprovada';s.doneAt=o.adjAt;
    addEvent(o,'Seu pedido nº '+o.no+' teve item em falta: '+it.name+' (pedido '+it.qOrig+', separado '+it.q+'). Novo total: '+brl(o.total)+'.');
    let extra='';if(o.recLaunched&&Math.abs(o.total-before)>0.004)extra=dropRec(o);return 'ok'+extra}
  const p=S.products.find(x=>x.id===s.pid);if(!p)return 'Produto não encontrado.';
  const std=sugStdPrice(o,p,s.q),price=packPrice>0?Math.round(packPrice*100)/100:std.price,neg=Math.abs(price-std.price)>=0.005,before=o.total;
  const item={ie:!!std.ie,rp:!!std.rp,commP:pCommOwn(p),pid:p.id,cat:p.cat||'',cost:p.cost>0?p.cost:'',refC:refCOf(p),name:p.name,unit:p.unit,perPack:packOf(p)||'',kg:isKg(p)||undefined,code:p.code||'',ean:p.ean||'',base:baseOf(p),price,label:neg?'Preço negociado':std.label,q:s.q};
  o.chk=o.chk||{};let msg;
  if(s.type==='troca'){const k=o.items.findIndex(i=>ikey(i)===s.fromKey);if(k<0)return 'O item original não está mais no pedido.';const old=o.items[k];o.items.splice(k,1,item);delete o.chk[s.fromKey];o.chk[ikey(item)]=true;
    msg='Seu pedido nº '+o.no+': '+old.name+' foi substituído por '+p.name+' ('+s.q+'). '}
  else{o.items.push(item);o.chk[ikey(item)]=true;msg='Seu pedido nº '+o.no+': incluímos '+s.q+'× '+p.name+'. '}
  Object.assign(o,orderTotals(o));s.status='aprovada';s.doneAt=new Date().toISOString();s.price=price;
  addEvent(o,msg+'Novo total: '+brl(o.total)+'.');
  let extra='';if(o.recLaunched&&Math.abs(o.total-before)>0.004)extra=dropRec(o);
  return 'ok'+extra;
}

function bindOcc(root,rer){

/* lança o que está escolhido na tela (também usado ao confirmar, se o motorista esquecer de tocar em Lançar) */

/* devolução: tira do pedido, devolve ao estoque e abate do contas a receber em aberto */
function retApply(o,R,reason,who){const its=o.items.filter(i=>i.q>0),out=[];
  its.forEach((i,k)=>{const q=parseInt(R[k])||0;if(q>0)out.push({i,q:Math.min(q,i.q)})});if(!out.length)return '!Informe a quantidade devolvida.';
  const before=o.total;out.forEach(({i,q})=>{i.qRet=(i.qRet||0)+q;i.q-=q});Object.assign(o,orderTotals(o));syncStock(o);const amount=Math.round((before-o.total)*100)/100;
  let left=amount;(S.receivables||[]).filter(r=>r.orderId===o.id&&!r.paidAt).sort((a,b)=>String(b.due).localeCompare(String(a.due))).forEach(r=>{if(left<=0.004)return;const t=Math.min(r.amount,left);r.amount=Math.round((r.amount-t)*100)/100;left=Math.round((left-t)*100)/100;r.adjNote=(r.adjNote?r.adjNote+' · ':'')+'devolução −'+brl(t)});
  S.receivables=(S.receivables||[]).filter(r=>!(r.orderId===o.id&&!r.paidAt&&!(r.amount>0.004)));
  if(left>0.004)o.credit=Math.round(((o.credit||0)+left)*100)/100;
  (o.returns=o.returns||[]).push({at:new Date().toISOString(),by:who,reason,amount,items:out.map(({i,q})=>({name:i.name,q,price:i.price}))});
  addEvent(o,'Devolução registrada no pedido nº '+o.no+': '+out.map(({i,q})=>q+'× '+i.name).join(', ')+'. Novo total: '+brl(o.total)+'.');
  return 'Devolução registrada · '+brl(amount)+' a menos'+(left>0.004?' · cliente fica com crédito de '+brl(left)+' (já tinha pago)':o.recLaunched?' · abatido do contas a receber':'')}

const hoursSince=t=>t?(Date.now()-new Date(t).getTime())/36e5:0;
function ageTxt(t){const h=hoursSince(t);return h<1?'há menos de 1h':h<48?'há '+Math.floor(h)+'h':'há '+Math.floor(h/24)+' dias'}
/* pendência sem resposta além do prazo volta para você decidir */
function pendSweep(){const P=pendH();if(!(P.exp>0))return;let ch=false;const now=new Date().toISOString();
  S.orders.forEach(o=>{if(o.status==='cancelado')return;
    if(o.appr==='contra'&&hoursSince(o.apprAt)>=P.exp){o.appr='pendente';o.expired=true;o.apprNote='Sem resposta do '+(o.negCli?'cliente':'vendedor')+' em '+P.exp+'h. Decida você.';(o.apprHist=o.apprHist||[]).push({at:now,by:'Sistema',what:'resposta venceu sem retorno'});ch=true}
    (o.sugs||[]).forEach(s=>{if(s.status==='pendente'&&s.toSeller&&hoursSince(s.at)>=P.exp){s.toSeller=false;s.expired=true;ch=true}})});
  if(ch)save()}
function admDecisoes(){
  const c=$('#tabc'),P=pendH(),since=addDays(today(),-6);

/* ================= TROCAS E FALTAS: separação dos pedidos de vendedor ================= */
const ordSeller=o=>{const s=o&&sellerById(o.sellerId);return s&&s.active!==false?s:null};
/* decisão de uma sugestão (troca, inclusão ou falta) por quem for: vendedor ou administrador */
function sugDecide(o,s,ok,by,price){const at=new Date().toISOString();
  if(!ok){s.status='recusada';s.doneAt=at;s.decBy=by;s.sellerSeen=!!(ordSeller(o)&&by===ordSeller(o).name);if(s.type==='qtd'&&o.chk)delete o.chk[s.fromKey];return 'ok'}
  const r=approveSug(o,s,price||0);if(r.startsWith('ok')){s.decBy=by;s.sellerSeen=!!(ordSeller(o)&&by===ordSeller(o).name)}return r}
function sugDesc(o,s){const p=S.products.find(x=>x.id===s.pid),old=s.type==='troca'?o.items.find(i=>ikey(i)===s.fromKey):null;
  if(s.type==='qtd')return `<span class="rulechip" style="color:var(--warn)">Falta</span> <b>${esc(s.fromName)}</b>: pedido ${esc(qtyTxt(s.qFrom,s.unit,0))} → separado <b>${esc(qtyTxt(s.q,s.unit,0))}</b>`;
  const std=p&&s.status==='pendente'?sugStdPrice(o,p,s.q):null,pk=s.price!=null?s.price:std?std.price:0,diff=s.status==='pendente'&&p?(old?pk*s.q-old.price*old.q:pk*s.q):null;
  return (s.type==='troca'?`<span class="rulechip">Troca</span> ${old?esc(qtyTxt(old.q,old.unit,packOfItem(old)))+' · <s>'+esc(old.name)+'</s>':'<s>'+esc(s.fromName)+'</s>'} → <b>${esc(qtyTxt(s.q,s.unit,s.pk))} · ${esc(s.name)}</b>`:`<span class="rulechip">Incluir</span> <b>${esc(qtyTxt(s.q,s.unit,s.pk))} · ${esc(s.name)}</b>`)
    +(pk?` <span class="small muted">(${brl(pk)} a embalagem${diff!=null?' · '+(diff>=0?'+':'−')+' '+brl(Math.abs(diff))+' no pedido':''})</span>`:'')}
/* vendedor: perguntas da separação e avisos de falta */
function vendSepBox(me){const mine=S.orders.filter(o=>o.sellerId===me.id&&o.status!=='cancelado');
  const ask=[],news=[];mine.forEach(o=>(o.sugs||[]).forEach(s=>{if(s.status==='pendente'&&s.toSeller)ask.push({o,s});else if(s.status!=='pendente'&&s.sellerSeen===false)news.push({o,s})}));
  if(!ask.length&&!news.length)return '';
  return `<section class="vsep"><b>Separação dos seus pedidos</b>
    ${ask.map(({o,s})=>`<div class="vsepq"><div class="small muted">Pedido nº ${o.no} · ${esc(o.customer)} · ${esc(s.by||'Conferente')} pergunta:</div><div>${s.type==='troca'?'Pode trocar?':'Pode incluir?'} ${sugDesc(o,s)}</div>${s.note?`<div class="small">"${esc(s.note)}"</div>`:''}
      <div class="row" style="gap:6px"><button class="btn dlb" data-vsok="${o.id}|${s.id}">${s.type==='troca'?'Pode trocar':'Pode incluir'}</button><button class="btn ghost dlb" data-vsno="${o.id}|${s.id}">${s.type==='troca'?'Não trocar':'Não incluir'}</button></div></div>`).join('')}
    ${news.length?`<div class="vsepn">${news.map(({o,s})=>`<div class="small">Pedido nº ${o.no} · ${esc(o.customer)}: ${s.type==='qtd'?(s.status==='aprovada'?'':'<b>falta recusada</b> · ')+sugDesc(o,s)+(s.note?' · "'+esc(s.note)+'"':''):sugDesc(o,s)+' · <b>'+(s.status==='aprovada'?'aprovada':'recusada')+'</b> por '+esc(s.decBy||'Loja')}</div>`).join('')}<button class="btn ghost dlb" data-vsseen="1">Ok, entendi</button></div>`:''}</section>`}
function bindVendSep(app,me,rer){
  const act=(v,ok)=>{const [oid,sid]=v.split('|'),o=S.orders.find(x=>x.id===oid),s=o&&(o.sugs||[]).find(x=>x.id===sid);if(!s||s.status!=='pendente')return;const r=sugDecide(o,s,ok,me.name,0);if(!r.startsWith('ok')){toast(r);return}
    save();toast(ok?(s.type==='troca'?'Troca aprovada: o conferente já pode seguir':'Inclusão aprovada'):'Recusado: o conferente separa o que foi pedido');rer()};
  app.querySelectorAll('[data-vsok]').forEach(b=>b.onclick=()=>act(b.dataset.vsok,true));

}

function oDate(o){const d=new Date(o.date);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}

/* fora do claude.ai (arquivo aberto no celular ou site próprio): download comum do navegador */
function dlLocal(filename,data){try{const ext=(filename.split('.').pop()||'').toLowerCase(),mime={pdf:'application/pdf',csv:'text/csv;charset=utf-8',json:'application/json',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}[ext]||'application/octet-stream';
  const url=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},4000);toast('Arquivo baixado: '+filename);return Promise.resolve(true)}
  catch(e){toast('Não consegui baixar o arquivo neste aparelho.');return Promise.resolve(false)}}
async function offerFile(filename,data){

  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(!dl)return dlLocal(filename,data);
  try{await dl.save({filename,data});toast('Arquivo salvo: '+filename);return true}
  catch(e){const c=e&&e.code;if(c==='declined')return;toast(c==='rate_limited'?'Já existe um download aguardando confirmação.':c==='unavailable'||c==='not_granted'||c==='capability_disabled'?'Baixar arquivos não está disponível nesta tela. Abra o app pelo claude.ai no navegador.':'Não foi possível salvar o arquivo ('+(c||'erro')+').')}
}

function listXlsx(list){
  const sum=[['Nº pedido','Data','Cliente','CNPJ / CPF','Telefone','Situação','Receber','Pagamento','Observação','Subtotal (R$)','Desconto (R$)','Total (R$)'],
    ...list.map(o=>[o.no,oDate(o),o.customer,oDoc(o),o.phone||'',stLabel(o),oRecv(o),o.pay,o.note||'',o.sub,o.disc?-o.disc:0,o.total])];
  const it=[['Nº pedido','Cliente','Código interno','Código de barras','Produto','Unidade','Qtd pedida','Qtd separada','Preço unit. (R$)','Condição','Total (R$)'],
    ...list.flatMap(o=>itemRows(o).map(r=>[o.no,o.customer,...r]))];
  const w1=XLSX.utils.aoa_to_sheet(sum),w2=XLSX.utils.aoa_to_sheet(it);
  w1['!cols']=[{wch:10},{wch:16},{wch:28},{wch:20},{wch:16},{wch:20},{wch:34},{wch:16},{wch:24},{wch:13},{wch:13},{wch:13}];
  w2['!cols']=[{wch:10},{wch:26},{wch:14},{wch:16},{wch:34},{wch:22},{wch:10},{wch:12},{wch:15},{wch:22},{wch:13}];
  fmtCols(w1,[9,10,11],1,sum.length-1);fmtCols(w2,[8,10],1,it.length-1);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,w1,'Pedidos');XLSX.utils.book_append_sheet(wb,w2,'Itens');
  return XLSX.write(wb,{type:'array',bookType:'xlsx'});
}
function fmtCols(ws,cols,r0,r1){for(let r=r0;r<=r1;r++)for(const c of cols){const cell=ws[XLSX.utils.encode_cell({r,c})];if(cell&&typeof cell.v==='number')cell.z='#,##0.00'}}

const pbrl=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

function makePdf(orders,opt){

  const doc=mkPdf(J,{unit:'mm',format:'a4'});

/* separação consolidada: soma de todos os pedidos por produto (combos abertos nos componentes) */
function pickAgg(orders){
  const m=new Map();
  const add=(key,info,q,no)=>{if(!(q>0))return;let r=m.get(key);if(!r){r={...info,q:0,by:[]};m.set(key,r)}r.q+=q;const b=r.by.find(x=>x.no===no);if(b)b.q+=q;else r.by.push({no,q})};
  orders.forEach(o=>o.items.forEach(i=>{
    if(i.combo)(i.components||[]).forEach(c=>{const p=S.products.find(x=>x.id===c.pid);add(c.pid||c.code||c.name,{code:c.code||'',name:c.name,unit:(p&&p.unit)||c.unit||'',cat:(p&&p.cat)||'Outros',pk:p?packOf(p):null,kg:isKg(p)},c.q*i.q,o.no)});
    else{const p=itemProduct(i);add(i.pid||i.code||i.name,{code:i.code||'',name:i.name,unit:i.unit||'',cat:i.cat||(p&&p.cat)||'Outros',pk:packOfItem(i),kg:itKg(i)},i.q,o.no)}}));
  return [...m.values()].sort((a,b)=>catSort(a.cat,b.cat)||a.name.localeCompare(b.name,'pt-BR'));
}

  doc.autoTable({startY:24,margin:{top:14,left:8,right:8,bottom:14},
    head:[['OK','Cód.','Produto','Embalagem','Qtd total','Por pedido']],body,theme:'plain',

    headStyles:{fillColor:[225,236,248],fontStyle:'bold',fontSize:7.5,textColor:[60,72,66]},

    willDrawPage:d=>{if(d.pageNumber>1)head(false)}});

function makePickPdf(orders){

function exportOrders(orders,kind,name){
  try{
    if(kind==='pick')offerFile(name+'.pdf',makePickPdf(orders));
    else if(kind==='pickall')offerFile(name+'.pdf',makePickAllPdf(orders));
    else if(kind==='pdf')offerFile(name+'.pdf',makePdf(orders));
    else{if(typeof XLSX==='undefined')throw new Error('x');offerFile(name+'.xlsx',orders.length===1&&name.startsWith('pedido-')?orderXlsx(orders[0]):listXlsx(orders))}
  }catch(e){pdfFail(e,kind==='xlsx'?'planilha':'')}
}

const PL_DEF={who:'geral',scope:'ativos',cats:null,sort:'estrutura',days:90,group:false,code:true,cond:true,qtd:true,combos:true,pmin:'',pmax:'',top:'',title:''};
const PL_PRESETS={
  completa:{label:'Folha de pedido completa',o:{}},
  top:{label:'Mais vendidos (top 50)',o:{sort:'vendidos',days:90,top:50,group:false,combos:false,title:'Mais vendidos'}},
  alfa:{label:'Lista simples A a Z',o:{sort:'alfa',group:false,cond:false,title:'Lista de preços de A a Z'}},
  interna:{label:'Conferência interna',o:{scope:'todos',qtd:false,combos:false,title:'Conferência de cadastro (uso interno)'}}
};
function plNum(v){const n=parseFloat(String(v==null?'':v).replace(/\./g,'').replace(',','.'));return isFinite(n)?n:0}
function plSold(days){
  const to=today(),d=new Date();d.setDate(d.getDate()-(Number(days)||90));
  const from=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const rk=buildRanking({from,to,mode:'todos',cat:'todas',sort:'q'}),m=new Map();
  rk.rows.forEach(r=>{if(r.code)m.set('c:'+r.code,(m.get('c:'+r.code)||0)+r.q);m.set('n:'+r.name,(m.get('n:'+r.name)||0)+r.q)});
  return p=>(p.code&&m.get('c:'+p.code))||m.get('n:'+p.name)||0;
}
function priceListProducts(o,ie){
  o=Object.assign({},PL_DEF,o||{});
  let L=S.products.filter(p=>o.scope==='todos'||p.active);
  if(Array.isArray(o.cats)){const cs=new Set(o.cats);L=L.filter(p=>cs.has(p.cat||'Outros'))}
  const pv=p=>Number(p.price)*(ie?ieF(p):1);
  const mn=plNum(o.pmin),mx=plNum(o.pmax);
  if(mn>0)L=L.filter(p=>pv(p)>=mn);if(mx>0)L=L.filter(p=>pv(p)<=mx);
  const nm=(a,b)=>a.name.localeCompare(b.name,'pt-BR');let cmp=prodCatSort;
  if(o.sort==='alfa')cmp=nm;
  else if(o.sort==='menor')cmp=(a,b)=>pv(a)-pv(b)||nm(a,b);
  else if(o.sort==='maior')cmp=(a,b)=>pv(b)-pv(a)||nm(a,b);
  else if(o.sort==='codigo')cmp=(a,b)=>String(a.code||'~').localeCompare(String(b.code||'~'),'pt-BR',{numeric:true})||nm(a,b);
  else if(o.sort==='vendidos'){const q=plSold(o.days);cmp=(a,b)=>q(b)-q(a)||nm(a,b)}
  L=L.slice().sort(cmp);
  const top=Math.floor(plNum(o.top));if(top>0)L=L.slice(0,top);
  if(o.sort!=='estrutura'&&o.group)L.sort((a,b)=>catSort(a.cat||'Outros',b.cat||'Outros'));
  return L;
}

/* ---------- estoque: baixa automática quando o pedido é concluído ---------- */
const hasStock=p=>p&&p.stock!==''&&p.stock!=null&&!isNaN(p.stock);
const hasMin=p=>p&&p.minStock!==''&&p.minStock!=null&&!isNaN(p.minStock);
const isCritical=p=>hasStock(p)&&hasMin(p)&&Number(p.stock)<=Number(p.minStock);
/* deixa o estoque coerente com a situação do pedido: concluído baixa; se sair de concluído, devolve */
function syncStock(o){
  const want={};
  if(o.status==='concluido')o.items.forEach(i=>{if(!(i.q>0))return;(i.combo?(i.components||[]).map(c=>({p:S.products.find(x=>x.id===c.pid),q:c.q*i.q})):[{p:itemProduct(i),q:i.q}]).forEach(({p,q})=>{if(hasStock(p))want[p.id]=(want[p.id]||0)+q})});
  const had=o.stockApplied||{};
  new Set([...Object.keys(want),...Object.keys(had)]).forEach(pid=>{const d=(want[pid]||0)-(had[pid]||0);if(!d)return;const p=S.products.find(x=>x.id===pid);if(p&&hasStock(p))p.stock=Number(p.stock)-d});
  o.stockApplied=want;
}
/* ---------- tabela de preço por cliente (A para os grandes, B para os pequenos) ---------- */
const TABLES=[];
function tableOf(c){return c&&TABLES.includes(c.table)?c.table:''}
/* ---------- preço com IE: contribuinte de ICMS comprando com nota fiscal ---------- */
let IE_CTX=null;
function ieClient(c){return !!(c&&c.ieOk)}
function ieOn(){if(IE_CTX!=null)return IE_CTX;return ui.view==='cliente'&&ieClient(ui.client)&&!!ui.nf}
function ieF(p){if(!condOn('ie'))return 1;const a=Number(p&&p.iePrice),b=Number(p&&p.price);return p&&!p.isCombo&&a>0&&a<b?a/b:1}
/* tabela onerada: o preço do cadastro é o de retirada; para o cliente a tabela sai X% acima (frete) e, retirando, esse X% volta como desconto */
const onerOn=()=>!!S.store.pickupOner&&Number(S.store.pickupDisc)>0;
let ONER_M=null;function withOner(m,fn){const pr=ONER_M;ONER_M=m;try{return fn()}finally{ONER_M=pr}}
/* tabela onerada: na entrega o preço leva +X% (frete); na retirada fica o preço de cadastro */
const onerPick=()=>ONER_M==='retirada';
function onerF(p){return onerOn()&&!onerPick()&&!(p&&p.rules&&p.rules.retira&&p.rules.retira.on&&Number(p.rules.retira.price)>0)?1+Number(S.store.pickupDisc)/100:1}
function pickAmt(list,pct){const t=list.reduce((s,i)=>s+i.price*i.q,0);return Math.round((onerOn()?t-t/(1+pct/100):t*pct/100)*100)/100}
function ieAdj(p,v){v=Number(v);const f=ieOn()?ieF(p):1;const r=f<1?Math.round(v*f*100)/100:v,o=onerF(p);return o>1?Math.round(r*o*100)/100:r}
function withIe(on,fn){const prev=IE_CTX;IE_CTX=on;try{return fn()}finally{IE_CTX=prev}}
function baseOf(p){const b=ieOn()&&ieF(p)<1?Number(p.iePrice):Number(p.price),o=onerF(p);return o>1?Math.round(b*o*100)/100:b}
function ieTag(p){if(ui.view!=='cliente'||!ieClient(ui.client)||ieF(p)>=1)return '';const n=dispPack(p),u=v=>n?brl(Math.round(v/n*100)/100)+'/un.':brl(v);
  return ieOn()?'':`<div class="ietag off">Com IE (com nota): <b>${u(Number(p.iePrice))}</b></div>`}
function ieNow(p){return ui.view==='cliente'&&ieOn()&&ieF(p)<1}

/* ---------- limite de crédito ---------- */
const isCash=pay=>(S.cashPays||[]).includes(pay);
function creditInfo(c,extra){
  const limit=Number(c&&c.creditLimit)||0;
  const recs=(S.receivables||[]).filter(r=>r.customerId===c.id&&!r.paidAt);
  const overdue=recs.filter(r=>recStatus(r)==='vencido').reduce((s,r)=>s+r.amount,0);
  const pend=S.orders.filter(o=>o.customerId===c.id&&OPEN.includes(o.status)&&!isCash(o.pay)&&!o.recLaunched).reduce((s,o)=>s+o.total,0);
  const used=Math.round((recs.reduce((s,r)=>s+r.amount,0)+pend)*100)/100;
  const avail=limit?Math.round((limit-used)*100)/100:null;
  let reason='';
  if(overdue>0.004)reason='Você tem '+brl(overdue)+' em parcelas vencidas.';
  else if(limit&&used+(extra||0)>limit+0.004)reason=avail>0?'Este pedido passa do seu limite de crédito. Disponível a prazo: '+brl(avail)+'.':'Seu limite de crédito a prazo está todo utilizado.';
  return {limit,used,avail,overdue,blocked:!!reason,reason};
}
/* formas liberadas para este pedido: bloqueado = só as à vista */
function payOptions(c,total){const ap=allowedPays(c),ci=creditInfo(c,total);return {list:ci.blocked?ap.filter(isCash):ap,ci}}

/* ---------- contas a receber automático ao concluir ---------- */
function autoReceivables(o,prev){
  if(o.status==='concluido'&&!o.recLaunched){
    if(S.store.autoRec===false||isCash(o.pay))return '';
    let k=daysFromPay(o.pay);if(k.startsWith('outro:'))k=k.slice(6);
    const days=parseDays(k);
    if(!k||!days.length)return 'Não identifiquei o prazo de "'+o.pay+'". Lance no contas a receber pelo botão do pedido.';
    const cu=S.customers.find(x=>x.id===o.customerId),grp=uid(),parts=splitParcels(o.total,days),base=today();
    parts.forEach((p,i)=>S.receivables.push({id:uid(),group:grp,auto:true,orderId:o.id,customerId:o.customerId,customer:cu?cu.name:o.customer,orderNo:String(o.no),desc:o.pay,parcel:(i+1)+'/'+parts.length,amount:p.amount,due:addDays(base,p.days),paidAt:'',created:new Date().toISOString()}));
    o.recLaunched=true;o.recAuto=true;
    return parts.length+' parcela'+(parts.length>1?'s geradas':' gerada')+' no contas a receber';
  }
  if(prev==='concluido'&&o.status!=='concluido'&&o.recAuto){
    const mine=S.receivables.filter(r=>r.orderId===o.id&&r.auto);
    if(mine.some(r=>r.paidAt))return 'Este pedido já tem parcela paga. Confira o contas a receber.';
    S.receivables=S.receivables.filter(r=>!(r.orderId===o.id&&r.auto));o.recLaunched=false;o.recAuto=false;
    return 'Parcelas deste pedido removidas do contas a receber';
  }
  return '';
}

function dbStats(a,b){const os=S.orders.filter(o=>o.status!=='cancelado'&&orderDay(o)>=a&&orderDay(o)<=b);let T=0,C=0,CM=0,tot=0;

const pctBR1=v=>v==null?'—':(Math.round(v*10)/10).toLocaleString('pt-BR')+'%';

/* barras por dia (uma série: altura = valor; dica com o valor exato) */

/* rosca por categoria: até 5 fatias + "Outras" em cinza, com legenda e valores */
function dbDonut(m){const all=[...m.entries()].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),tot=all.reduce((s,x)=>s+x[1],0);if(!tot)return '<div class="small muted">Sem vendas no período.</div>';
  const top=all.slice(0,5),rest=all.slice(5).reduce((s,x)=>s+x[1],0),L=top.map((x,k)=>({n:x[0],v:x[1],c:'var(--s'+(k+1)+')'}));if(rest>0)L.push({n:'Outras',v:rest,c:'var(--s-other)'});
  const R=15.915,gap=L.length>1?0.6:0;let acc=0;

const nCat=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function catList(){
  if(!Array.isArray(S.categories))S.categories=[];
  /* primeira vez: monta a árvore padrão e encaixa os produtos que já existem */
  if(!S.catTreeV1){
    const old=S.categories.slice(),rn={'laticinios':'Laticínios e frios'};
    S.products.forEach(p=>{const t=rn[nCat(p.cat)];if(t)p.cat=t});
    const tree=CAT_TREE.map(([n,subs])=>({id:uid(),name:n,subs:subs.map(x=>({id:uid(),name:x}))}));
    old.forEach(c=>{const nm=rn[nCat(c.name)]||c.name;if(!tree.some(t=>nCat(t.name)===nCat(nm)))tree.push({id:c.id||uid(),name:nm,subs:[]})});
    S.categories=tree;
    S.products.forEach(p=>{if(p.sub)return;const cat=tree.find(t=>nCat(t.name)===nCat(p.cat));if(!cat||!cat.subs.length)return;
      const h=SUB_HINT.find(([re,sub])=>re.test(p.name)&&cat.subs.some(s=>s.name===sub));if(h)p.sub=h[1]});
    S.catTreeV1=true;
  }
  const L=S.categories;L.forEach(c=>{if(!Array.isArray(c.subs))c.subs=[]});
  S.products.forEach(p=>{const cn=String(p.cat||'').trim();if(!cn)return;let c=L.find(x=>nCat(x.name)===nCat(cn));
    if(!c){c={id:uid(),name:cn,subs:[]};L.push(c)}

  return L;

function catNames(){return catList().map(c=>c.name)}
function catObj(n){return catList().find(c=>c.name===n)}
function subNames(cat){const c=catObj(cat);return c?c.subs.map(s=>s.name):[]}
function catIdx(n){const i=catNames().indexOf(n||'Outros');return i<0?999:i}
function subIdx(cat,sub){if(!sub)return 999;const i=subNames(cat).indexOf(sub);return i<0?998:i}
function catSort(a,b){return catIdx(a)-catIdx(b)||String(a||'').localeCompare(String(b||''),'pt-BR')}
function prodCatSort(a,b){return catSort(a.cat||'Outros',b.cat||'Outros')||subIdx(a.cat,a.sub)-subIdx(b.cat,b.sub)||a.name.localeCompare(b.name,'pt-BR')}
function catLabel(p){return (p.cat||'Outros')+(p.sub?' › '+p.sub:'')}
/* ---------- ARRUMAR CADASTRO: sugestões de limpeza com um toque ---------- */
const DEMO_NAMES=['Arroz Tipo 1 5kg','Feijão Carioca 1kg','Açúcar Cristal 5kg','Óleo de Soja 900ml','Café Torrado e Moído 500g','Leite Integral UHT 1L','Refrigerante Cola 2L','Água Mineral 500ml','Detergente Neutro 500ml','Papel Higiênico Folha Dupla'];
const CAT_DUP=[['Perfumaria','Higiene e perfumaria'],['Embalagens','Descartáveis e embalagens'],['Laticínios','Laticínios e frios']];
const LIMP_RX=/\b(SAB(A|Ã)O\s*(EM\s*)?P(O|Ó)|DETERG|AMACIANTE|DESINFET|ALVEJ|AGUA SANIT|ÁGUA SANIT|LIMPA\s|MULTIUSO|ESPONJA|LUSTRA)/i;
function cleanSugs(){const cats=catList(),has=n=>cats.some(c=>c.name===n),out=[];
  const demo=S.products.filter(p=>DEMO_NAMES.includes(p.name)&&!String(p.code||'').trim()&&!String(p.ean||'').trim());
  if(demo.length)out.push({k:'demo',t:`Remover ${demo.length} produto${demo.length>1?'s':''} de exemplo`,d:demo.map(p=>esc(p.name)).join(', ')});
  cats.filter(c=>/^\d+$/.test(c.name.trim())).forEach(c=>{const ps=S.products.filter(p=>p.cat===c.name);out.push({k:'num:'+c.id,t:`Categoria "${esc(c.name)}" parece um erro de digitação`,d:ps.length?ps.map(p=>esc(p.name)).join(', '):'sem produtos',sel:true})});
  CAT_DUP.forEach(([a,b])=>{if(has(a)&&has(b)){const n=S.products.filter(p=>p.cat===a).length;out.push({k:'dup:'+a+'|'+b,t:`Juntar "${esc(a)}" em "${esc(b)}"`,d:n?n+' produto'+(n>1?'s':'')+' mudam de categoria':'sem produtos: só some da lista'})}});
  if(has('Limpeza')){const ps=S.products.filter(p=>p.cat!=='Limpeza'&&LIMP_RX.test(p.name));if(ps.length)out.push({k:'limp',t:`Mover ${ps.length} produto${ps.length>1?'s':''} de limpeza para "Limpeza"`,d:ps.map(p=>esc(p.name)+' <span class="muted">(está em '+esc(p.cat)+')</span>').join(', ')})}
  return out}
function cleanBox(){const L=cleanSugs();if(!L.length)return '';const cats=catList().filter(c=>!/^\d+$/.test(c.name.trim()));
  return `<section class="panel cleanbox"><b>Arrumar o cadastro</b><div class="small muted">Encontrei estes pontos. Confira e toque em Aplicar em cada um.</div>
    ${L.map(x=>`<div class="cleanit"><div><b>${x.t}</b><div class="small">${x.d}</div></div><div class="row" style="gap:6px">${x.sel?`<select data-clto="${x.k}" aria-label="Mover para">${cats.map(c=>`<option ${c.name==='Mercearia'?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:''}<button class="btn dlb" data-clean="${x.k}">${x.sel?'Mover e excluir':'Aplicar'}</button></div></div>`).join('')}</section>`}
function cleanApply(k,to){const cats=catList();
  const merge=(from,dest)=>{const A=S.categories.find(c=>c.name===from),B=S.categories.find(c=>c.name===dest);if(!A||!B)return;
    (A.subs||[]).forEach(sb=>{if(!(B.subs||[]).some(x=>x.name===sb.name))(B.subs=B.subs||[]).push(sb)});
    S.products.forEach(p=>{if(p.cat===from)p.cat=dest});S.categories=S.categories.filter(c=>c!==A)};
  if(k==='demo'){const ids=new Set(S.products.filter(p=>DEMO_NAMES.includes(p.name)&&!String(p.code||'').trim()&&!String(p.ean||'').trim()).map(p=>p.id));S.products=S.products.filter(p=>!ids.has(p.id));return ids.size+' produtos de exemplo removidos'}
  if(k.startsWith('num:')){const c=S.categories.find(x=>x.id===k.slice(4));if(!c||!to)return '';merge(c.name,to);return 'Produtos movidos para '+to+' e categoria excluída'}
  if(k.startsWith('dup:')){const [a,b]=k.slice(4).split('|');merge(a,b);return '"'+a+'" juntada em "'+b+'"'}
  if(k==='limp'){let n=0;S.products.forEach(p=>{if(p.cat!=='Limpeza'&&LIMP_RX.test(p.name)){p.cat='Limpeza';p.sub='';n++}});return n+' produtos movidos para Limpeza'}
  return ''}

function orderCost(o){let cost=0,miss=0;o.items.forEach(i=>{if(!(i.q>0))return;const c=itemCost(i,undefined,orderIeSale(o));if(c==null){miss++;cost+=i.price*i.q}else cost+=c*i.q});return {cost,miss}}
function tripCalc(list,costs){
  const rev=list.reduce((s,o)=>s+o.total,0),pc=list.reduce((s,o)=>s+orderCost(o).cost,0),miss=list.reduce((s,o)=>s+orderCost(o).miss,0);
  const comm=list.reduce((s,o)=>s+orderComm(o),0);
  const trip=CITY_COSTS.reduce((s,[k])=>s+(Number(costs[k])||0),0),profit=rev-pc-comm-trip;
  return {rev,pc,comm,trip,profit,miss,mProd:rev>0?(rev-pc-comm)/rev*100:null,mFinal:rev>0?profit/rev*100:null,vol:list.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.q,0),0)};
}

}

function makeRomaneio(orders,meta){
  meta=meta||{};
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error('pdf');
  const doc=mkPdf(J,{unit:'mm',format:'a4',orientation:'landscape'}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  const groups=new Map();orders.forEach(o=>{const b=(orderCityName(o)||'Cidade não informada')+(orderBairro(o)?' · '+orderBairro(o):'');groups.set(b,[...(groups.get(b)||[]),o])});
  const keys=[...groups.keys()].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const vol=o=>o.items.reduce((s,i)=>s+i.q,0);
  const head=()=>{doc.setFillColor(10,102,178);doc.rect(0,0,W,22,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(S.store.name,10,12);
    doc.setFontSize(11);doc.text('ROMANEIO DE ENTREGA'+(meta.city?' · '+meta.city.toUpperCase():''),10,18.5);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Data: '+new Date().toLocaleDateString('pt-BR')+'   ·   '+orders.length+' entrega'+(orders.length===1?'':'s')+'   ·   '+orders.reduce((s,o)=>s+vol(o),0)+' volumes',W-10,12,{align:'right'});
    doc.text('Motorista: '+(meta.driver||'______________________________')+'   Veículo / placa: '+(meta.car||'______________'),W-10,18.5,{align:'right'})};

const sellerById=id=>id?(S.sellers||[]).find(x=>x.id===id):null;

/* política por categoria: margem mínima e comissão (produto > subcategoria > categoria) */
const setV=v=>v!==''&&v!=null&&!isNaN(v);
function catObj(name){return (S.categories||[]).find(c=>nCat(c.name)===nCat(name||'Outros'))||null}
function subObj(cat,sub){const c=catObj(cat);return c&&sub?(c.subs||[]).find(x=>nCat(x.name)===nCat(sub))||null:null}
function polMin(p){if(!p)return null;if(setV(p.minMg))return {v:Number(p.minMg),src:'do produto'};const sb=subObj(p.cat,p.sub);if(sb&&setV(sb.minMg))return {v:Number(sb.minMg),src:'da subcategoria'};const c=catObj(p.cat);if(c&&setV(c.minMg))return {v:Number(c.minMg),src:'da categoria'};return null}

function tableMg(p){if(!(p.cost>0)||!(p.price>0))return null;const own=pCommOwn(p),r=own!==''?own:Math.max(0,...(S.sellers||[]).map(x=>Number(x.commission)||0));return (p.price-effCost(p,p.cost,p.price)-p.price*r/100)/p.price*100}

function itemCommRate(o,i){

/* ---------- COMBOS ---------- */
const comboById=id=>(S.combos||[]).find(c=>c.id===id);
/* soma do combo: preço de venda em separado (na tabela do cliente) e custo */
function comboTotals(cb,cli){
  let list=0,cost=0,miss=0;const parts=[];
  let lock=0;(cb.items||[]).forEach(it=>{const p=S.products.find(x=>x.id===it.pid);if(!p)return;const pv=p.price;list+=pv*it.q;if(p.cost>0){cost+=p.cost*it.q;lock+=lockCost(p)*it.q}else miss++;parts.push({p,q:it.q,pv})});
  return {list:Math.round(list*100)/100,cost:Math.round(cost*100)/100,lock:Math.round(lock*100)/100,miss,parts};
}
/* o combo vira um "produto" para o carrinho, o pedido e os relatórios */
function comboAsProduct(cb,cli){
  const T=comboTotals(cb,cli===undefined?ui.client:cli);
  return {id:'c:'+cb.id,isCombo:true,comboId:cb.id,name:'Combo: '+cb.name,unit:'Combo',code:'',ean:'',cat:'Combos',active:cb.active!==false&&T.parts.length>0,
    price:cb.price,cost:T.miss?'':T.cost,refCost:!T.miss&&T.lock>T.cost+0.004?T.lock:'',commission:'',rules:emptyRules(),photo:(T.parts[0]&&T.parts[0].p.photo)||ph(cb.name,30),
    listPrice:T.list,components:T.parts.map(x=>({pid:x.p.id,name:x.p.name,code:x.p.code||'',ean:x.p.ean||'',unit:x.p.unit||'',q:x.q})),desc:cb.desc||''};
}
function resolveCart(id){if(String(id).startsWith('c:')){const cb=comboById(id.slice(2));return cb?comboAsProduct(cb):null}return S.products.find(x=>x.id===id)}
function compLine(comps){return (comps||[]).map(c=>c.q+'× '+c.name).join(' + ')}
function comboCard(cp){
  const q=ui.cart[cp.id]||0,save=Math.round((cp.listPrice-cp.price)*100)/100,[r,c]=cp.price.toFixed(2).split('.');
  return `<article class="combo ${q?'incart':''}">
    <div class="cbh"><span class="cbtag">COMBO</span>${save>0.004?`<span class="cbsave">Você economiza ${brl(save)}</span>`:''}</div>
    <div class="cbb"><img src="${cp.photo}" alt="" loading="lazy"><div class="cbt"><b>${esc(cp.name.replace(/^Combo: /,''))}</b>${cp.desc?`<span class="cbd">${esc(cp.desc)}</span>`:''}<span class="cbc">${esc(compLine(cp.components))}</span></div></div>
    <div class="cbf"><div class="num">${save>0.004?`<s class="small muted">${brl(cp.listPrice)} separado</s>`:''}<div class="ptag"><span class="cur">R$</span><span class="val">${Number(r).toLocaleString('pt-BR')},${c}</span></div></div>
      ${q?`<div class="stepper" style="width:140px;margin:0"><button data-dec="${cp.id}" aria-label="Diminuir">−</button><input type="number" inputmode="numeric" min="0" value="${q}" data-qty="${cp.id}" aria-label="Quantidade do combo"><button data-inc="${cp.id}" aria-label="Aumentar">+</button></div>`:`<button class="addbtn" data-add="${cp.id}" style="width:140px;margin:0">Adicionar combo</button>`}</div>
  </article>`;
}
function activeCombos(){return (S.combos||[]).filter(c=>c.active!==false).map(c=>comboAsProduct(c)).filter(c=>c.active)}

async function camStart(onCode,er,btn){

    await scanCam.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.min(300,w*.9),height:Math.min(140,h*.5)}),experimentalFeatures:{useBarCodeDetectorIfSupported:true}},
      txt=>{const now=Date.now(),c=normCode(txt);if(c===scanLast.code&&now-scanLast.at<2000)return;scanLast={code:c,at:now};onCode(txt)},()=>{});
    if(btn)btn.textContent='Fechar câmera';

async function photoCode(f){let code='';

async function erpStockFor(p){
  const code=String(p.code||'').trim(),ean=normCode(p.ean),tries=[];
  if(/^\d{1,9}$/.test(code)&&Number(code)>=1)tries.push({codigoMercadoria:Number(code)});
  if(ean)tries.push({ean});
  for(const q of tries){let r=null;try{r=await stariaCall('consultar_estoque',{...q,agruparPor:'MERCADORIA',statusMercadoria:'TODOS',situacaoEstoque:'TODOS',limite:5})}catch(e){if(e&&e.code==='tool_error')continue;throw e}
    const it=(r&&Array.isArray(r.itens)?r.itens:[]).filter(x=>x&&x.codigoMercadoria!=null);if(it.length)return Number(it[0].estoque)||0}
  return null;
}

function famKey(f){return String(f||'').trim().toLowerCase()}
function famSibs(p){const k=famKey(p&&p.fam);return k?S.products.filter(x=>x.id!==p.id&&famKey(x.fam)===k):[]}
const FAM_COPY=['price','cost','refCost','rules','iePrice','unit','perPack','showUnit','cat','sub','trib','tablePrices','commission'];
function famCopy(from,to){FAM_COPY.forEach(k=>{to[k]=from[k]==null?from[k]:JSON.parse(JSON.stringify(from[k]))})}
/* junta os sabores da mesma família num card só; o card mostra o sabor escolhido */
function famGroup(list){const out=[],idx=new Map();ui.vsel=ui.vsel||{};
  list.forEach(p=>{const k=famKey(p.fam);if(!k){out.push({p,vars:null});return}if(idx.has(k)){idx.get(k).vars.push(p);return}const g={p,vars:[p],k};idx.set(k,g);out.push(g)});
  out.forEach(g=>{if(!g.vars)return;
    if(g.vars.length<2&&!S.products.some(x=>x.active&&x.id!==g.p.id&&famKey(x.fam)===g.k)){g.vars=null;return}
    g.vars.sort((a,b)=>String(a.var||a.name).localeCompare(String(b.var||b.name),'pt-BR'));
    g.p=g.vars.find(v=>v.id===ui.vsel[g.k])||g.vars.find(v=>ui.cart[v.id])||g.vars[0]});
  return out}

function varCheck(e,code,ean){
  if(e._von&&!e.fam)return 'Sabores: informe o produto (sem o sabor).';
  if(e.fam&&!e.var)return 'Sabores: informe o sabor deste item.';
  const nv=(e._nv||[]).filter(r=>r.var||r.code||r.ean),cs=new Set(code?[code.toLowerCase()]:[]),es=new Set(ean?[ean]:[]);
  if(nv.length&&!e.fam)return 'Para criar sabores, informe o produto (sem o sabor) e o sabor deste item.';
  for(const r of nv){
    if(!r.var)return 'Escreva o nome de cada sabor novo.';
    if(r.ean&&!/^\d{8,14}$/.test(r.ean))return 'O EAN do sabor '+r.var+' deve ter de 8 a 14 números.';
    const lc=r.code.toLowerCase();
    if(r.code&&(cs.has(lc)||S.products.some(x=>String(x.code||'').toLowerCase()===lc)))return 'O código '+r.code+' (sabor '+r.var+') já está em uso.';

function anItemCalc(o,i,rate){const net=itemNet(o,i),u=i.q>0?net/i.q:0,c=itemCost(i,u,orderIeSale(o));const cost=c==null?net:c*i.q,comm=net*rate/100;return {net,cost,comm,noCost:c==null,mg:net>0?(net-cost-comm)/net*100:null}}
/* preço (da unidade de venda) que dá a margem pedida, já tirando custo, impostos e comissão */
function anPriceFor(o,i,mg,r){const d=(o.discPct&&!noDisc(i))?o.discPct/100:0,ie=orderIeSale(o),a=itemCost(i,0,ie);if(a==null||!(a>0))return null;
  const b=(itemCost(i,1000,ie)-a)/1000,den=1-b-r/100-mg/100;if(den<=0.02)return null;return Math.ceil(a/den/(1-d)*100-1e-6)/100}
/* refaz subtotal, desconto de retirada e total do pedido depois de mudar preços */
function reTotal(o){const its=o.items.filter(i=>i.q>0),sub=Math.round(its.reduce((t,i)=>t+i.price*i.q,0)*100)/100,pct=Number(o.discPct)||0;
  const dl=its.filter(i=>!noDisc(i)),t=dl.reduce((x,i)=>x+i.price*i.q,0);o.sub=sub;o.disc=pct?Math.round((onerOn()?t-t/(1+pct/100):t*pct/100)*100)/100:0;o.total=Math.round((sub+(Number(o.fee)||0)-o.disc)*100)/100}

function stariaCached(t){t=stNorm(t);const lim=new Date(Date.now()-24*3600e3).toISOString();let best;

      const r=bought[0]||rows[0];

        cost:bought[0]&&custoTot>0?Math.round(custoTot/Number(r.quantidadeUltimaCompra)*100)/100:'',
        src:bought[0]?`custo do fornecedor na última compra em ${dBR(String(r.dataUltimaCompra).slice(0,10))}, filial ${r.filial}, ${Number(r.quantidadeUltimaCompra).toLocaleString('pt-BR')} un.${r.fornecedor?' · '+r.fornecedor:''}`:'sem compra registrada',
        many:new Set(rows.map(x=>x.codigoMercadoria)).size>1};
    }

function simProduct(e){
  const prazo=S.payments.find(p=>!isCash(p))||'',vista=S.payments.find(p=>isCash(p))||'',pc=Number(S.store.pickupDisc)||0;
  const p={...e,id:e.id||'tmp',rules:JSON.parse(JSON.stringify(e.rules||emptyRules())),price:Number(e.price)||0,iePrice:Number(e.iePrice)>0?Number(e.iePrice):''};
  if(!(p.price>0))return '';
  const n=packOf(p)||1,R=p.rules,tier=R.qty&&R.qty.on?R.qty.tiers.filter(t=>t.min>0&&t.price>0).sort((a,b)=>a.min-b.min)[0]:null;
  const qs=[1].concat(tier?[Number(tier.min)]:[]),ieOk=ieF(p)<1;
  const cell=(q,mode,pay,ie)=>{const r=withIe(ie,()=>priceFor(p,q,mode,pay));let v=r.price;const rp=!!r.rp;if(mode==='retirada'&&!rp&&pc)v=Math.round(v*(1-pc/100)*100)/100;
    const why=[r.label,mode==='retirada'&&!rp&&pc?'−'+String(pc).replace('.',',')+'% retirada':''].filter(Boolean).join(' · ');
    return `<td class="r num"><b>${n>1?brl(Math.round(v/n*100)/100)+'<small>/un.</small>':brl(v)}</b>${n>1?`<div class="upx">${brl(v)}</div>`:''}${why?`<div class="upx">${esc(why)}</div>`:''}</td>`};
  const sc=[['Entrega','entrega',prazo,'a prazo'],['Entrega','entrega',vista,'à vista'],['Retirada','retirada',prazo,'a prazo'],['Retirada','retirada',vista,'à vista']].filter(x=>x[2]);
  return `<details class="psimbox" ${ui.simOpen?'open':''}><summary><b>Simulação: quanto o cliente paga</b> <span class="small muted">· com o que está digitado acima</span></summary>
    <div class="tablewrap" style="margin-top:8px"><table class="btable simt"><thead><tr><th>Situação</th>${qs.map(q=>`<th class="r">${q} ${esc(packWord(p,q>1))}${ieOk?' · sem IE':''}</th>${ieOk?`<th class="r">${q} ${esc(packWord(p,q>1))} · com IE</th>`:''}`).join('')}</tr></thead>
    <tbody>${sc.map(([a,mode,pay,b])=>`<tr><td><b>${a}</b> <span class="small muted">${b} (${esc(pay)})</span></td>${qs.map(q=>cell(q,mode,pay,false)+(ieOk?cell(q,mode,pay,true):'')).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="small muted" style="margin-top:6px">Preço negociado no pedido e combos não entram aqui.</div></details>`;
}

function stCostView(){
  const c=$('#tabc'),U=ui.stCost,withCode=S.products.filter(p=>String(p.code||'').trim()||String(p.ean||'').trim());
  const pc1=v=>v==null||!isFinite(v)?'—':(Math.round(v*10)/10).toLocaleString('pt-BR',{minimumFractionDigits:1})+'%';
  if(U.phase==='input'){
    c.innerHTML=`<div class="sectionhead"><h2>Atualizar custos pelo StarIA</h2><button class="btn ghost" id="ucBack">Voltar aos produtos</button></div>

      if(stariaWeb()){const miss=stariaMissing(withCode.map(p=>String(p.code||'').trim()||String(p.ean||'').trim()));if(miss.length){stariaQueue(miss);$('#ucErr').textContent='Pedido enviado ao Claude ('+miss.length+' produtos). Assim que ele consultar o StarIA, a busca continua sozinha aqui.';
        stariaWait(miss,()=>{if(ui.stCost===U&&U.phase==='input'){const g=$('#ucGo');if(g)g.click()}});return}}
      U.phase='loading';U.rows=[];U.miss=[];stCostView();
      for(let k=0;k<withCode.length;k++){const p=withCode[k];
        try{const r=await stariaLookup(String(p.code||'').trim()||String(p.ean||'').trim());
          if(!r||r.cost===''){U.miss.push({p,why:r?'sem custo no StarIA':'não encontrado'})}
          else{const n=packOf(p)||1,nw=Math.round(r.cost*n*100)/100,old=p.cost>0?Number(p.cost):null,diff=old?(nw-old)/old*100:null;
            const mgO=old&&p.price>0?(p.price-old)/p.price*100:null,mgN=p.price>0?(p.price-nw)/p.price*100:null;
            const flag=(mgN!=null&&mgN<=0)?'custo maior que o preço de venda':(diff!=null&&Math.abs(diff)>40)?'mudou mais de 40%':'';
            U.rows.push({p,r,n,old,nw,diff,mgO,mgN,flag,on:!flag&&(old==null||Math.abs(nw-old)>=0.01)})}}

      U.phase='review';stCostView();
    };
    return;
  }
  if(U.phase==='loading'){c.innerHTML=`<div class="sectionhead"><h2>Atualizar custos pelo StarIA</h2></div><div class="panel" style="display:grid;gap:10px;max-width:760px"><b>Consultando o StarIA…</b><div class="pbar"><span id="ucProg" style="width:0%"></span></div><span class="small muted" id="ucProgT">0 de ${withCode.length} consultados</span></div>`;return}
  const rows=U.rows.slice().sort((a,b)=>(b.flag?1:0)-(a.flag?1:0)||Math.abs(b.diff||0)-Math.abs(a.diff||0));
  const sel=rows.filter(r=>r.on),same=rows.filter(r=>r.old!=null&&Math.abs(r.nw-r.old)<0.01).length;
  c.innerHTML=`<div class="sectionhead"><h2>Atualizar custos pelo StarIA</h2><div class="row" style="gap:6px"><button class="btn ghost" id="ucBack">Voltar aos produtos</button><button class="btn" id="ucApply" ${sel.length?'':'disabled'}>Aplicar ${sel.length} custo${sel.length===1?'':'s'}</button></div></div>
    <div class="small muted" style="margin-bottom:10px">${rows.length} encontrados · ${same} sem mudança · ${rows.filter(r=>r.flag).length} para conferir${U.miss.length?' · '+U.miss.length+' sem resultado':''}. Os marcados com aviso vêm desmarcados: confira se o StarIA registra esse produto por unidade ou por embalagem.</div>

      ${rows.map((x,i)=>`<tr class="${x.flag?'warnrow':''}"><td><input type="checkbox" data-uc="${U.rows.indexOf(x)}" ${x.on?'checked':''} aria-label="Aplicar ${esc(x.p.name)}"></td>
        <td><b>${esc(x.p.name)}</b><div class="codes">Cód. ${esc(x.p.code||'-')} · ${x.n>1?x.n+' un. × '+brl(x.r.cost):'unidade '+brl(x.r.cost)} · ${esc(x.r.src)}</div>${x.flag?`<div class="small" style="color:var(--warn);font-weight:700">Confira: ${x.flag}</div>`:''}</td>
        <td class="r num">${x.old==null?'—':brl(x.old)}</td><td class="r num"><b>${brl(x.nw)}</b></td>
        <td class="r num ${x.diff>0?'neg':''}">${x.diff==null?'novo':(x.diff>0?'+':'')+pc1(x.diff)}</td><td class="r num">${pc1(x.mgO)}</td><td class="r num"><b class="${x.mgN!=null&&x.mgN<0?'neg':''}">${pc1(x.mgN)}</b></td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">Nenhum custo encontrado no StarIA.</div>'}
    ${U.miss.length?`<details class="panel" style="margin-top:12px"><summary><b>${U.miss.length} sem resultado</b></summary>${U.miss.map(m=>`<div class="small">${esc(m.p.name)} · cód. ${esc(m.p.code||'-')} · ${esc(m.why)}</div>`).join('')}</details>`:''}`;
  $('#ucBack').onclick=()=>{ui.stCost=null;admProducts()};
  c.querySelectorAll('[data-uc]').forEach(cb=>cb.onchange=()=>{U.rows[+cb.dataset.uc].on=cb.checked;stCostView()});
  const all=$('#ucAll');if(all)all.onchange=()=>{U.rows.forEach(r=>r.on=all.checked);stCostView()};

function resize(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const m=600,s=Math.min(1,m/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}

const PRAZOS=[['0','À vista'],['7','7 dias'],['14','14 dias'],['21','21 dias'],['28','28 dias'],['30','30 dias'],['7,14','7 / 14'],['7,14,21','7 / 14 / 21'],['14,28','14 / 28'],['7,14,21,28','7 / 14 / 21 / 28'],['30,60','30 / 60'],['30,60,90','30 / 60 / 90'],['outro','Outro prazo']];
const addDays=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const dBR=iso=>{if(!iso)return '';const [y,m,d]=String(iso).split('-');return esc(d+'/'+m+'/'+y)};
const daysBetween=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};

const REC_ST={aberto:'Em aberto',vencido:'Vencido',pago:'Pago'};
function parseDays(str){return String(str).split(/[\/,;\s]+/).map(x=>parseInt(x)).filter(n=>!isNaN(n)&&n>=0&&n<=720)}
/* prazo sugerido a partir do nome da forma de pagamento, ex.: "Boleto 14 dias" -> 14 */
function daysFromPay(pay){const ex=S.payDays&&S.payDays[pay];if(ex!=null&&ex!==''){const k=parseDays(ex).join(',');if(k)return PRAZOS.some(p=>p[0]===k)?k:'outro:'+k}const n=String(pay||'').match(/\d+(?:\s*[\/,]\s*\d+)*/);if(!n)return (S.cashPays||[]).includes(pay)?'0':'';const k=parseDays(n[0]).join(',');return PRAZOS.some(p=>p[0]===k)?k:'outro:'+k}

function splitParcels(total,days){const n=days.length,cents=Math.round(total*100),base=Math.floor(cents/n);return days.map((d,i)=>({days:d,amount:(i===n-1?cents-base*(n-1):base)/100}))}
